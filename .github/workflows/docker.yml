name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Smoke test on amd64: healthcheck turns healthy, image size and idle memory are reported.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: oct:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and wait for healthy
        run: |
          docker run -d --name oct -p 3000:3000 oct:smoke
          for i in $(seq 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' oct)
            [ "$s" = healthy ] && break
            sleep 2
          done
          docker logs oct
          [ "$s" = healthy ] || { echo "container is $s"; exit 1; }
          curl -fsS http://localhost:3000/api/health
      - name: Model test photos in the image
        run: |
          # Through the built code, so the path from dist/ is checked too.
          docker run --rm --entrypoint node oct:smoke --input-type=module -e "
            import { access } from 'node:fs/promises';
            const m = await import('/app/server/dist/ai/model-test/compare.js');
            const e = await m.readExpected();
            for (const p of e) await access(new URL(p.file, m.TEST_PHOTOS_DIR));
            if (e.length !== 9) throw new Error('expected 9 photos, got ' + e.length);
            console.log(e.length + ' test photos in', m.TEST_PHOTOS_DIR.pathname);"
      - name: Image size and idle memory
        run: |
          sleep 10
          size=$(docker image inspect -f '{{.Size}}' oct:smoke)
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' oct)
          echo "| Image size | $((size / 1000000)) MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Idle memory | $mem |" >> "$GITHUB_STEP_SUMMARY"
          echo "size=$((size / 1000000))MB mem=$mem"
          [ "$size" -lt 200000000 ] || { echo "image exceeds 200 MB"; exit 1; }
      # The README install from scratch: compose file and .env.example as shipped, admin signs in.
      - name: Compose install as in README
        run: |
          docker rm -f oct
          mkdir -p /tmp/install && cd /tmp/install
          sed 's#image: .*#image: oct:smoke#' "$GITHUB_WORKSPACE/docker-compose.yml" > docker-compose.yml
          sed -e 's#^ADMIN_EMAIL=.*#ADMIN_EMAIL=admin@example.com#' \
              -e 's#^ADMIN_PASSWORD=.*#ADMIN_PASSWORD=smoke-Pass-1!#' \
              "$GITHUB_WORKSPACE/.env.example" > .env
          docker compose up -d
          id=$(docker compose ps -q opencalorietracker)
          for i in $(seq 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' "$id")
            [ "$s" = healthy ] && break
            sleep 2
          done
          docker compose logs
          [ "$s" = healthy ] || { echo "container is $s"; exit 1; }
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"smoke-Pass-1!"}'
          # Default compose: Docker creates ./data as root, the app hands it to 1000:1000.
          [ "$(stat -c %u:%g data/oct.sqlite)" = 1000:1000 ]
          docker compose down
      # ADR-0017: a NAS folder owned by 1026:100, a wrong `user:`, and an upgrade from the 0.1.0 volume.
      - name: Data folder owners
        run: |
          env="-e PUBLIC_URL=http://localhost:3000 -e ADMIN_EMAIL=admin@example.com -e ADMIN_PASSWORD=smoke-Pass-1!"
          healthy() {
            for i in $(seq 30); do
              s=$(docker inspect -f '{{.State.Health.Status}}' oct)
              [ "$s" = healthy ] && break
              sleep 2
            done
            docker logs oct
            [ "$s" = healthy ] || { echo "container is $s"; exit 1; }
          }
          login() {
            curl -fsS -X POST http://localhost:3000/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"admin@example.com","password":"smoke-Pass-1!"}'
          }

          # (a) PUID/PGID 1026:100 on a folder owned by them; sign-in survives a restart.
          mkdir /tmp/nas && sudo chown 1026:100 /tmp/nas
          docker run -d --name oct -p 3000:3000 -v /tmp/nas:/data -e PUID=1026 -e PGID=100 $env oct:smoke
          healthy && login
          [ -z "$(sudo find /tmp/nas ! -user 1026 -o ! -group 100)" ] || { sudo ls -lan /tmp/nas; exit 1; }
          docker restart oct && healthy && login

          # The CLI run by `docker exec` as root leaves no root-owned files behind.
          docker exec oct node dist/cli.js reset-admin-access
          [ -z "$(sudo find /tmp/nas ! -user 1026 -o ! -group 100)" ] || { sudo ls -lan /tmp/nas; exit 1; }
          docker rm -f oct

          # (b) `user:` that cannot write the folder: the server stays up and names the problem.
          docker run -d --name oct -p 3000:3000 -v /tmp/nas:/data --user 1000:1000 $env oct:smoke
          healthy
          docker logs oct 2>&1 | grep -q 'data_dir_not_writable: /data is not writable for 1000:1000'
          curl -fsS http://localhost:3000/api/config | grep -q '"setupError":"data_dir_not_writable"'
          docker rm -f oct

          # Garbage PUID: refuses to start rather than run as root.
          rc=0; timeout 60 docker run --rm -e PUID=0 oct:smoke || rc=$?
          [ "$rc" = 1 ] || { echo "PUID=0 exited with $rc"; exit 1; }

          # (c) Upgrade: a volume written by the 0.1.0 image keeps working.
          docker volume create oct-old
          docker run -d --name oct -p 3000:3000 -v oct-old:/data $env ghcr.io/mastekator/opencalorietracker:0.1.0
          healthy && login && docker rm -f oct
          docker run -d --name oct -p 3000:3000 -v oct-old:/data $env oct:smoke
          healthy && login

  # Multi-arch build; pushed to GHCR only from main (edge) and v* tags.
  image:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
