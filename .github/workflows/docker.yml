name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Smoke test on amd64: healthcheck turns healthy, image size and idle memory are reported.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: oct:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and wait for healthy
        run: |
          docker run -d --name oct -p 3000:3000 oct:smoke
          for i in $(seq 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' oct)
            [ "$s" = healthy ] && break
            sleep 2
          done
          docker logs oct
          [ "$s" = healthy ] || { echo "container is $s"; exit 1; }
          curl -fsS http://localhost:3000/api/health
      - name: Image size and idle memory
        run: |
          sleep 10
          size=$(docker image inspect -f '{{.Size}}' oct:smoke)
          mem=$(docker stats --no-stream --format '{{.MemUsage}}' oct)
          echo "| Image size | $((size / 1000000)) MB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Idle memory | $mem |" >> "$GITHUB_STEP_SUMMARY"
          echo "size=$((size / 1000000))MB mem=$mem"
          [ "$size" -lt 200000000 ] || { echo "image exceeds 200 MB"; exit 1; }

  # Multi-arch build; pushed to GHCR only from main (edge) and v* tags.
  image:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
