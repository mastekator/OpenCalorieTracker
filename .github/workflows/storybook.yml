name: Storybook

# Publishes the design system to the `design/storybook` branch; Cloudflare Pages
# serves that branch as-is. A push made with GITHUB_TOKEN does not trigger other workflows.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: storybook
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oct/web build-storybook
      - name: Force-push the build as a single orphan commit
        working-directory: apps/web/storybook-static
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b design/storybook
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Storybook for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:design/storybook
