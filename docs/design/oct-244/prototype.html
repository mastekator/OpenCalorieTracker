<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCT-244 · First-run setup wizard</title>
<link rel="stylesheet" href="../oct-13/tokens.css">
<script src="../preview-bar.js"></script>
<style>
/* Base components = ../oct-13 + ../oct-16 prototypes (same spec) */
/* ===== Prototype canvas (not part of the app) ===== */
*{box-sizing:border-box;margin:0}
html{background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--color-selection)}
body{padding:var(--space-10) var(--space-8)}
.doc-h1{font-size:var(--text-large-title-size);line-height:var(--text-large-title-lh);font-weight:700;letter-spacing:var(--tracking-tight)}
.doc-lead{font-size:var(--text-subhead-size);color:var(--color-text-secondary);max-width:70ch;margin-top:var(--space-2)}
.doc-section{margin-top:var(--space-12)}
.doc-h2{font-size:var(--text-title-size);font-weight:600;margin-bottom:var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-8);align-items:flex-start;margin-top:var(--space-6)}
.frame{display:flex;flex-direction:column;gap:var(--space-3);width:390px}
.frame>figcaption{font-size:var(--text-footnote-size);color:var(--color-text-secondary);line-height:var(--text-footnote-lh)}
.frame>figcaption b{color:var(--color-text);font-weight:600}

/* ===== Device chrome (prototype only) ===== */
.phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--color-bg);outline:1px solid var(--color-separator);display:flex;flex-direction:column}
.status{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 40px;font-size:var(--text-body-size);font-weight:600}
.status::after{content:"";width:68px;height:12px;border-radius:var(--radius-full);background:currentColor;opacity:.85;-webkit-mask:linear-gradient(90deg,#000 0 30%,transparent 30% 38%,#000 38% 62%,transparent 62% 70%,#000 70%)}
.island{position:absolute;top:11px;left:50%;translate:-50% 0;width:124px;height:36px;border-radius:var(--radius-full);background:#000;z-index:100}
.home-ind{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:134px;height:5px;border-radius:var(--radius-full);background:var(--color-text);z-index:100}

/* ===== App components (tokens only) ===== */
.icon{width:var(--icon-size);height:var(--icon-size);flex:none;fill:none;stroke:currentColor;stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:var(--icon-size-sm);height:var(--icon-size-sm)}
.scroll{flex:1;overflow:hidden;display:flex;flex-direction:column}
.navbar{height:var(--navbar-height);flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--space-2)}
.navbar .title{font-size:var(--text-headline-size);font-weight:600}
.navbar .back{display:flex;align-items:center;gap:2px;color:var(--color-accent);font-size:var(--text-body-size);min-height:var(--tap-min);padding-right:var(--space-2)}
.navbar .act{justify-self:end;color:var(--color-accent);font-size:var(--text-body-size);min-height:var(--tap-min);display:flex;align-items:center;padding:0 var(--space-2)}
.large-title{font-size:var(--text-large-title-size);line-height:var(--text-large-title-lh);font-weight:700;letter-spacing:var(--tracking-tight);padding:var(--space-1) var(--screen-gutter) var(--space-2)}
.pad{padding:0 var(--screen-gutter)}
.stack{display:flex;flex-direction:column;gap:var(--space-4)}
.stack-sm{display:flex;flex-direction:column;gap:var(--space-2)}
.grow{flex:1}
.bottom{padding:var(--space-4) var(--screen-gutter) calc(34px + var(--space-2));display:flex;flex-direction:column;gap:var(--space-3)}
.t-title{font-size:var(--text-title-size);line-height:var(--text-title-lh);font-weight:600}
.t-headline{font-size:var(--text-headline-size);line-height:var(--text-headline-lh);font-weight:600}
.t-body{font-size:var(--text-body-size);line-height:var(--text-body-lh)}
.t-sub{font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh)}
.t-foot{font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.t-cap{font-size:var(--text-caption-size);line-height:var(--text-caption-lh);font-weight:500}
.muted{color:var(--color-text-secondary)}
.center{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* brand */
.brand{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-headline-size);font-weight:600}
.brand .mark{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center}

/* buttons */
.btn{appearance:none;border:0;font:inherit;width:100%;min-height:var(--control-height-lg);border-radius:var(--radius-md);font-size:var(--text-headline-size);font-weight:600;display:flex;align-items:center;justify-content:center;gap:var(--space-2);padding:0 var(--space-4);cursor:pointer;transition:transform var(--duration-fast) var(--ease-out),background var(--duration-fast) var(--ease-out)}
.btn:active{transform:scale(var(--press-scale))}
.btn:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}
.btn-primary{background:var(--color-accent);color:var(--color-on-accent)}
.btn-primary.pressed{background:var(--color-accent-pressed)}
.btn-tonal{background:var(--color-accent-soft);color:var(--color-accent)}
.btn-plain{background:transparent;color:var(--color-accent);min-height:var(--tap-min)}
.btn-danger{background:var(--color-danger);color:var(--color-on-danger)}
.btn-danger-plain{background:transparent;color:var(--color-danger);min-height:var(--tap-min)}
.btn[disabled],.btn.disabled{background:var(--color-surface-2);color:var(--color-text-disabled);cursor:default}
.btn-plain.disabled{background:transparent}
.btn-sm{min-height:var(--control-height);width:auto;font-size:var(--text-subhead-size);padding:0 var(--space-4)}
.link{color:var(--color-accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.spinner{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin 800ms linear infinite}
@keyframes spin{to{rotate:360deg}}

/* fields */
.field{display:flex;flex-direction:column;gap:var(--space-2)}
.field label{font-size:var(--text-subhead-size);font-weight:500}
.input{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-height-lg);padding:0 var(--space-4);border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border-strong);font-size:var(--text-body-size)}
.input .ph{color:var(--color-text-secondary)}
.input .val{flex:1}
.input .trail{color:var(--color-text-secondary);display:grid;place-items:center;width:var(--tap-min);height:var(--tap-min);margin-right:calc(-1 * var(--space-3))}
.input.focus{border-color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)}
.input.caret .val::after{content:"";display:inline-block;width:2px;height:1.1em;background:var(--color-accent);vertical-align:-3px;margin-left:1px}
.input.error{border-color:var(--color-danger);box-shadow:inset 0 0 0 1px var(--color-danger)}
.input.locked{background:var(--color-surface-2);border-color:transparent;color:var(--color-text-secondary)}
.field .msg{display:flex;gap:var(--space-1);align-items:flex-start;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary)}
.field .msg.err{color:var(--color-danger)}
.rules{list-style:none;padding:0;display:grid;gap:var(--space-1);font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.rules li{display:flex;gap:var(--space-2);align-items:center;color:var(--color-text-secondary)}
.rules li.ok{color:var(--color-accent)}
.rules li.bad{color:var(--color-danger)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:var(--radius-md);background:var(--color-surface-2);min-height:var(--control-height)}
.seg span{display:grid;place-items:center;border-radius:calc(var(--radius-md) - 2px);font-size:var(--text-subhead-size);font-weight:500;color:var(--color-text-secondary)}
.seg span.on{background:var(--color-surface);color:var(--color-text);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* grouped lists */
.group-h{font-size:var(--text-footnote-size);color:var(--color-text-secondary);padding:0 var(--space-4) var(--space-2);margin-top:var(--space-6)}
.group{background:var(--color-surface);border-radius:var(--radius-md);overflow:hidden}
.group-f{font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary);padding:var(--space-2) var(--space-4) 0}
.cell{display:flex;align-items:center;gap:var(--space-3);min-height:var(--control-height);padding:var(--space-3) var(--space-4);position:relative;font-size:var(--text-body-size)}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--space-4);border-top:1px solid var(--color-separator)}
.cell.ic+.cell::before,.cell.ic+.cell.ic::before{left:calc(var(--space-4) + 30px + var(--space-3))}
.cell .lead-ic{width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--color-accent-soft);color:var(--color-accent);flex:none}
.cell .lead-ic.danger{background:var(--color-danger-soft);color:var(--color-danger)}
.cell .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cell .main .sub{font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.cell .val{color:var(--color-text-secondary)}
.cell .chev{color:var(--color-text-secondary)}
.cell.danger{color:var(--color-danger)}
.cell.accent{color:var(--color-accent)}
.cell.dis{color:var(--color-text-disabled)}
.badge{font-size:var(--text-caption-size);font-weight:600;padding:2px var(--space-2);border-radius:var(--radius-sm);background:var(--color-surface-2);color:var(--color-text-secondary);white-space:nowrap}
.badge.ok{background:var(--color-accent-soft);color:var(--color-accent)}
.badge.warn{background:var(--color-warning-soft);color:var(--color-warning)}
.badge.err{background:var(--color-danger-soft);color:var(--color-danger)}

/* banners */
.banner{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh)}
.banner .b-title{font-weight:600}
.banner.notice{background:var(--color-notice)}
.banner.warning{background:var(--color-warning-soft)}
.banner.warning .icon{color:var(--color-warning)}
.banner.danger{background:var(--color-danger-soft)}
.banner.danger .icon{color:var(--color-danger)}
.banner.accent{background:var(--color-accent-soft)}
.banner.accent .icon{color:var(--color-accent)}
.banner .close{margin:-10px -12px -10px auto;width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;color:var(--color-text-secondary);flex:none}
.offline-bar{display:flex;gap:var(--space-2);align-items:center;justify-content:center;min-height:32px;padding:var(--space-1) var(--space-4);background:var(--color-notice);font-size:var(--text-footnote-size);color:var(--color-text-secondary)}

/* divider "или" */
.or{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--color-separator)}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--color-scrim);z-index:var(--z-sheet)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-sheet);background:var(--color-surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-sheet);padding:var(--space-2) var(--screen-gutter) calc(34px + var(--space-4));display:flex;flex-direction:column;gap:var(--space-4)}
.sheet .grab{width:36px;height:5px;border-radius:var(--radius-full);background:var(--color-separator);margin:0 auto var(--space-1)}
.sheet .sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet .x{width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;margin-right:calc(-1 * var(--space-3));color:var(--color-text-secondary)}
.sheet .inset{background:var(--color-surface-2)}
.alert{position:absolute;left:50%;top:50%;translate:-50% -50%;width:300px;z-index:var(--z-alert);background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);text-align:center;box-shadow:var(--shadow-toast)}
.alert .btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}
.alert .btns.col{grid-template-columns:1fr}
.toast{position:absolute;left:var(--screen-gutter);right:var(--screen-gutter);bottom:calc(34px + var(--tabbar-height) + var(--space-3));z-index:var(--z-toast);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-toast);font-size:var(--text-subhead-size)}
.toast .act{margin-left:auto;font-weight:600;min-height:var(--tap-min);display:flex;align-items:center}

/* state blocks */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-8) var(--space-6)}
.state .s-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--color-surface-2);color:var(--color-text-secondary);margin-bottom:var(--space-2)}
.state .s-ic.danger{background:var(--color-danger-soft);color:var(--color-danger)}
.state .s-ic.warning{background:var(--color-warning-soft);color:var(--color-warning)}
.state p{max-width:30ch}
.state .btn{margin-top:var(--space-3)}
.skel{background:var(--color-surface-2);border-radius:var(--radius-sm);height:14px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;translate:-100% 0;background:linear-gradient(90deg,transparent,var(--color-surface),transparent);animation:shimmer 1.4s var(--ease-in-out) infinite}
@keyframes shimmer{to{translate:100% 0}}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-tabbar);height:calc(var(--tabbar-height) + 34px);padding-bottom:34px;background:var(--tabbar-bg);-webkit-backdrop-filter:var(--tabbar-blur);backdrop-filter:var(--tabbar-blur);border-top:1px solid var(--color-separator);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--text-tab-size);font-weight:var(--text-tab-weight);color:var(--color-text-secondary);min-height:var(--tabbar-height);justify-content:center}
.tab.on{color:var(--color-accent)}
.cam{justify-self:center;width:var(--camera-button-size);height:var(--camera-button-size);border-radius:50%;background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center;box-shadow:var(--shadow-camera);translate:0 -14px}
.cam .icon{width:30px;height:30px}

/* swatches (docs only) */
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)}
.sw{border-radius:var(--radius-md);overflow:hidden;background:var(--color-surface);font-size:var(--text-caption-size);outline:1px solid var(--color-separator)}
.sw i{display:block;height:44px}
.sw div{padding:var(--space-2);line-height:1.3}
.sheetdoc{width:390px;background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);outline:1px solid var(--color-separator)}
.sheetdoc h3{font-size:var(--text-headline-size)}
.doc-note{font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.navmap{width:820px;background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-6);outline:1px solid var(--color-separator);display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-3);font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.navmap .col{display:flex;flex-direction:column;gap:var(--space-2)}
.navmap .nd{padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--color-surface-2)}
.navmap .nd.tab{background:var(--color-accent-soft);color:var(--color-accent);font-weight:600;align-items:flex-start;font-size:var(--text-footnote-size)}
.navmap .nd.modal{outline:1px dashed var(--color-border-strong);background:transparent}
.navmap .arrow{color:var(--color-text-secondary);text-align:center}

/* ===== Desktop (≥ 1024px) — section 6 ===== */
.frame.wide{width:1280px}
.desk{position:relative;width:1280px;height:800px;border-radius:var(--radius-lg);overflow:hidden;background:var(--color-bg);outline:1px solid var(--color-separator);display:flex;flex-direction:column}
.desk .chrome{height:36px;flex:none;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4);background:var(--color-surface-2);border-bottom:1px solid var(--color-separator);font-size:var(--text-caption-size);color:var(--color-text-secondary)}
.desk .chrome i{width:12px;height:12px;border-radius:50%;background:var(--color-separator)}
.desk .chrome .url{margin-left:var(--space-6);padding:var(--space-1) var(--space-3);border-radius:var(--radius-sm);background:var(--color-surface)}
.desk .body{flex:1;display:flex;min-height:0}
.side{width:var(--sidebar-width);flex:none;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-6) var(--space-4);border-right:1px solid var(--color-separator)}
.side .brand{padding:0 var(--space-3) var(--space-6)}
.side .btn{margin-bottom:var(--space-4)}
.nav-i{display:flex;align-items:center;gap:var(--space-3);min-height:var(--tap-min);padding:0 var(--space-3);border-radius:var(--radius-md);font-size:var(--text-body-size);color:var(--color-text)}
.nav-i .icon{color:var(--color-text-secondary)}
.nav-i.hover{background:var(--color-hover)}
.nav-i.on{background:var(--color-accent-soft);color:var(--color-accent);font-weight:600}
.nav-i.on .icon{color:var(--color-accent)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--space-1)}
.side .who{padding:var(--space-2) var(--space-3);font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.main-area{flex:1;overflow:hidden;padding:var(--space-8) var(--desktop-gutter)}
.main-area .inner{max-width:var(--content-max-width-wide);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6)}
.main-area .large-title{padding:0}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:var(--space-6)}
.drop{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-8);border:2px dashed var(--color-border-strong);border-radius:var(--radius-lg);color:var(--color-text-secondary);text-align:center;font-size:var(--text-subhead-size)}
.auth-desk{flex:1;display:grid;place-items:center}
.auth-card{width:var(--content-max-width);background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-10);box-shadow:var(--shadow-toast)}
.dialog{position:absolute;left:50%;top:50%;translate:-50% -50%;width:var(--dialog-max-width);z-index:var(--z-sheet);background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-toast);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
.dialog .sheet-head{display:flex;align-items:center;justify-content:space-between}
.dialog .x{width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;margin-right:calc(-1 * var(--space-3));color:var(--color-text-secondary)}
.kbd{font-size:var(--text-caption-size);padding:1px var(--space-1);border-radius:var(--radius-sm);outline:1px solid var(--color-separator);color:var(--color-text-secondary)}
.toast.desk-toast{left:50%;right:auto;translate:-50% 0;bottom:var(--space-6);width:auto;max-width:var(--dialog-max-width)}

/* ===== OCT-16 additions (tokens only; prototype-only bits marked) ===== */
.frame.sm{width:390px}
.phone .content{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:var(--space-4);padding-bottom:var(--space-4)}
.navbar .x-btn{width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;color:var(--color-text-secondary)}
.navbar .txt-btn{color:var(--color-accent);font-size:var(--text-body-size);min-height:var(--tap-min);display:flex;align-items:center;padding:0 var(--space-2)}
.bottom.bar{background:var(--color-bg);border-top:1px solid var(--color-separator);margin-top:auto}
.foot-note{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary)}
.foot-note .icon{color:var(--color-accent)}

/* photo (user content) */
.photo{display:block;width:100%;height:var(--photo-preview-height);border-radius:var(--radius-lg);overflow:hidden;position:relative;background:var(--color-surface-2)}
.photo svg{width:100%;height:100%;display:block}
.photo.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255 / .28) 50%,transparent 70%);translate:-100% 0;animation:sweep 1.8s var(--ease-in-out) infinite}
@keyframes sweep{to{translate:100% 0}}
.photo.dim{height:calc(var(--photo-preview-height) * .6)}
.thumb{width:var(--thumb-size);height:var(--thumb-size);border-radius:var(--radius-md);overflow:hidden;flex:none;background:var(--color-surface-2)}
.thumb svg{width:100%;height:100%;display:block}
.thumb.add{display:grid;place-items:center;color:var(--color-accent);background:var(--color-accent-soft);font-size:var(--text-caption-size);font-weight:600;text-align:center;align-content:center;gap:2px}

/* totals header */
.totals{display:flex;gap:var(--space-4);align-items:center}
.kcal-big{display:flex;align-items:baseline;gap:var(--space-1)}
.kcal-big b{font-size:var(--text-large-title-size);line-height:var(--text-large-title-lh);font-weight:700;letter-spacing:var(--tracking-tight);font-variant-numeric:tabular-nums}
.macros{display:flex;gap:var(--space-3);font-size:var(--text-footnote-size);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.macros span{display:flex;align-items:center;gap:var(--space-1)}
.macros i{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-full)}
.m-p{background:var(--color-protein)} .m-f{background:var(--color-fat)} .m-c{background:var(--color-carbs)}


/* ===== OCT-244: first-run setup wizard (tokens only) ===== */
/* Mirrors the app token in apps/web/src/styles/tokens.css (not in the OCT-13 prototype tokens). */
:root{--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace}
code,.mono{font-family:var(--font-mono)}
.lang-bar{display:inline-flex}
.phone .content{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:var(--space-3) var(--screen-gutter) 0}
/* wizard header: brand + language, then step bar */
.wz-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.wz-lang{display:flex;align-items:center;gap:var(--space-1);min-height:var(--tap-min);padding:0 var(--space-2);margin-right:calc(-1 * var(--space-2));border-radius:var(--radius-md);color:var(--color-accent);font-size:var(--text-subhead-size);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-1);margin:var(--space-6) 0 var(--space-5)}
.steps i{height:var(--space-1);border-radius:var(--radius-full);background:var(--color-surface-2)}
.steps i.on{background:var(--color-accent)}
.wz-h{font-size:var(--text-title-size);line-height:var(--text-title-lh);font-weight:600;text-wrap:balance}
.wz-lead{font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh);color:var(--color-text-secondary);margin:var(--space-2) 0 var(--space-6);text-wrap:pretty}
/* setup code field */
.input.code{justify-content:center;min-height:calc(var(--control-height-lg) + var(--space-2));font-family:var(--font-mono);font-size:var(--text-title-size);letter-spacing:.14em;font-weight:600}
.input.code .val{flex:none}
.banner>div{flex:1;min-width:0}
.phone.tall{height:auto;min-height:844px}
.phone.tall .content{overflow:visible}
.input.code .ph{font-weight:400;letter-spacing:.14em}
.input.code.caret .val::after{vertical-align:-4px}
/* "where's the log" disclosure */
.disc{display:flex;align-items:center;gap:var(--space-1);min-height:var(--tap-min);color:var(--color-accent);font-size:var(--text-subhead-size);font-weight:600;align-self:flex-start}
.disc .icon{width:var(--icon-size-sm);height:var(--icon-size-sm);transition:rotate var(--duration-fast) var(--ease-out)}
.disc[aria-expanded="true"] .icon{rotate:180deg}
.how{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.how b{font-size:var(--text-subhead-size);font-weight:600}
.how .k{display:flex;flex-direction:column;gap:var(--space-1)}
.how .k+.k{padding-top:var(--space-3);border-top:1px solid var(--color-separator)}
.cmd{display:flex;align-items:center;gap:var(--space-1);border-radius:var(--radius-md);background:var(--color-surface-2);padding-left:var(--space-3)}
.cmd code{flex:1;min-width:0;white-space:pre-wrap;font-size:var(--text-footnote-size);padding:var(--space-2) 0}
.cmd .cp{width:var(--tap-min);height:var(--tap-min);flex:none;display:grid;place-items:center;color:var(--color-accent)}
.cmd .cp .icon{width:var(--icon-size-sm);height:var(--icon-size-sm)}
.path{font-weight:500;color:var(--color-text)}
.logline{font-family:var(--font-mono);color:var(--color-text-secondary);overflow-wrap:anywhere}
.logline mark{background:var(--color-selection);color:var(--color-text);border-radius:2px;padding:0 2px}
.ext{display:inline-flex;align-items:center;gap:var(--space-1);min-height:var(--tap-min);color:var(--color-accent);font-weight:600;font-size:var(--text-subhead-size)}
.ext .icon{width:var(--icon-size-sm);height:var(--icon-size-sm)}
/* stranger note */
.stranger{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary);margin-top:auto;padding-top:var(--space-4)}
.stranger .icon{width:var(--icon-size-sm);height:var(--icon-size-sm);flex:none;margin-top:1px}
.phone .bottom{padding-top:var(--space-3)}
/* full-screen states */
.st{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--space-2);padding-bottom:var(--space-10)}
.st .s-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--color-surface-2);color:var(--color-text-secondary);margin-bottom:var(--space-3)}
.st .s-ic.warning{background:var(--color-warning-soft);color:var(--color-warning)}
.st .s-ic.danger{background:var(--color-danger-soft);color:var(--color-danger)}
.st .s-ic.ok{background:var(--color-accent-soft);color:var(--color-accent)}
.st p{font-size:var(--text-body-size);line-height:var(--text-body-lh);color:var(--color-text-secondary);text-wrap:pretty}
.st .cmd{margin-top:var(--space-3)}
/* step 3 */
.done-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--color-accent-soft);color:var(--color-accent);margin-top:var(--space-4)}
.done-ic .icon{width:32px;height:32px;stroke-width:2.25}
.next{background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden}
.nx{display:flex;gap:var(--space-3);padding:var(--space-4);position:relative;align-items:flex-start}
.nx+.nx::before{content:"";position:absolute;top:0;right:0;left:calc(var(--space-4) + var(--tap-min) + var(--space-3));border-top:1px solid var(--color-separator)}
.nx .picon{display:grid;place-items:center;flex:none;width:var(--tap-min);height:var(--tap-min);border-radius:var(--radius-md);background:var(--color-accent-soft);color:var(--color-accent)}
.nx .picon.off{background:var(--color-surface-2);color:var(--color-text-secondary)}
.nx .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-1)}
.nx .m b{font-size:var(--text-headline-size);line-height:var(--text-headline-lh);font-weight:600}
.nx .m p{font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh);color:var(--color-text-secondary)}
.nx .btn-sm{align-self:flex-start;margin-top:var(--space-2)}
.sline{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);font-weight:600}
.sline i{flex:none;width:var(--space-2);height:var(--space-2);border-radius:var(--radius-full);background:currentColor}
.sline.ok{color:var(--color-accent)}
.sline.off{color:var(--color-text-secondary)} .sline.off i{background:transparent;border:2px solid currentColor}
.mono-v{font-family:var(--font-mono);font-size:var(--text-subhead-size);color:var(--color-text);overflow-wrap:anywhere}
/* desktop */
.desk{height:auto;min-height:800px}
.desk .auth-desk{padding:var(--space-10) 0}
.auth-card .how,.auth-card .next{background:var(--color-bg)}
.desk .auth-card{display:flex;flex-direction:column}
.desk .auth-card .steps{margin-top:var(--space-6)}
.desk .auth-card .stranger{margin-top:var(--space-6);padding-top:0}
.desk .auth-card .btn-primary{margin-top:var(--space-6)}
/* docs */
.flow{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:stretch;margin-top:var(--space-4);max-width:1200px;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.flow .fc{background:var(--color-surface);outline:1px solid var(--color-separator);border-radius:var(--radius-md);padding:var(--space-3);width:220px;display:flex;flex-direction:column;gap:var(--space-1)}
.flow .fc b{font-size:var(--text-subhead-size)}
.flow .fc.main{outline:2px solid var(--color-accent)}
.flow .ar{align-self:center;color:var(--color-text-secondary)}
.spec{max-width:1000px;font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh);display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-4)}
.spec h3{font-size:var(--text-headline-size);margin-top:var(--space-4)}
.spec li{margin-left:var(--space-5)}
.copy{border-collapse:collapse;max-width:1200px;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);margin-top:var(--space-4)}
.copy th,.copy td{border:1px solid var(--color-separator);padding:var(--space-2) var(--space-3);text-align:left;vertical-align:top}
.copy th{background:var(--color-surface-2);font-weight:600}
.copy td:first-child{color:var(--color-text-secondary);white-space:nowrap}
.copy tr.new td:first-child::after{content:" ●";color:var(--color-accent)}

    ${phone(step1({val:'K7QM-3XRP', cls:'locked'}), bottom(btn(T.checking, {busy:true})), `<b>1.3 Проверяем.</b> Поле заблокировано, кнопка «Проверяем…» со спиннером. Верный код → сразу шаг 2, без промежуточного «Код принят».`)}

    ${phone(step1({top:banner('warning','clock',T.tooT,T.tooB(14)), val:'K7QM-3XRP', cls:'locked'}), bottom(btn(T.cont,{dis:true})), `<b>1.5 Таймаут</b> (раздел 5 «Продукт OCT-2»). Поле и кнопка недоступны, минуты обновляются раз в минуту (<code>aria-live="polite"</code>). По окончании баннер исчезает сам.`)}
    ${phone(step1({noField:true, noDisc:true, top:banner('danger','shield',T.blkT,T.blkB, `<div style="margin-top:var(--space-2)">${cmd(CMD.reset)}</div>`)}), bottom(btn(T.again)), `<b>1.6 Блокировка</b> пары «IP + устройство» или IP. Форма скрыта — вводить бесполезно. Команда <code>reset-admin-access</code> снимает блокировки и в режиме мастера печатает новый код (AC-1.6). «Ввести новый код» перезагружает шаг 1.`)}
  </div>
  <div class="row">
    ${phone(state('clock','warning',T.expT,T.expB,cmd(CMD.restart)), bottom(btn(T.again)), `<b>1.7 Код истёк</b> (24 часа, AC-1.3). Показывается вместо формы — и при открытии адреса, и при отправке шага 1 или 2 (AC-2.2). Команда перезапуска с кнопкой «Скопировать»; «Ввести новый код» → 1.1.`)}
    ${phone(state('shield','danger',T.burnT,T.burnB,cmd(CMD.restart)), bottom(btn(T.again)), `<b>1.8 Код сгорел</b> — 5 неверных вводов со всех адресов (AC-1.5, решение владельца: 5, а не 20). Тот же макет, что 1.7, другая иконка и текст. Видят все посетители.`)}
    ${phone(state('check','ok',T.doneT,T.doneB), bottom(btn(T.signin)), `<b>1.9 Установка уже завершена</b> (E-3.1). Админа создали в другой вкладке, пока здесь шёл мастер: так отвечает отправка шага 1 или 2. «Войти» → обычный экран входа. Прямое открытие адреса после установки показывает вход сразу, без этого экрана.`)}
    ${phone(state('link','warning',T.urlT,T.urlB,''), bottom(btn(T.open(URL_))), `<b>1.10 Не по PUBLIC_URL, только passkey</b> (AC-2.7, <code>AUTH_METHODS=passkey</code>). Показываем сразу, до кода — иначе человек потратит код и упрётся в шаг 2. Если пароль включён — шаг 1 обычный, развилка на шаге 2 (2.6).`)}
    ${phone(step1({val:'K7QM-3XRP'}), bottom(btn(T.cont,{dis:true})), `<b>1.11 Офлайн.</b> Полоса «${T.offline}» под статус-баром, поле доступно, кнопка — нет. Сервер недоступен при живой сети — та же полоса «Сервер недоступен».`, {bar:`<div class="offline-bar" role="status">${I('wifi-off','sm')}${T.offline}</div>`})}
  </div>
</section>

<section class="doc-section" id="step2">
  <h2 class="doc-h2">Шаг 2 · Аккаунт администратора</h2>
  <p class="doc-lead">Как регистрация по приглашению (OCT-13, 2.1–2.2), только email вводится. Набор способов — по <code>AUTH_METHODS</code>. Назад на шаг 1 не ведём: код уже принят; закрыл вкладку — вводит код снова (E-3.3).</p>
  <div class="row">
    ${phone(step2(`${fEmail('anna@example.com')}${fName(T.anna,'focus caret')}${seg(true, T.pkHint)}`), bottom(btn(T.createPk,{icon:'key'})), `<b>2.1 Оба способа</b> (по умолчанию). Сегмент «Passkey | Пароль», выбран Passkey — как в приглашении. Email: <code>type="email" autocomplete="username"</code>, имя: <code>autocomplete="name"</code>. Главная кнопка внизу, в зоне большого пальца.`)}
    ${phone(step2(`${fEmail('anna@example.com')}${fName(T.anna)}${seg(false)}${pwFields('bad')}`), bottom(btn(T.createAcc)), `<b>2.2 Пароль, ошибки.</b> Правила AC-0.8 видны сразу серыми, при вводе — галочка/крест (иконка + цвет). Ошибки — при уходе из поля и при отправке. Частый пароль — «Этот пароль слишком распространён» под полем. Поля пароля: <code>autocomplete="new-password"</code>.`, {tall:true})}
    ${phone(step2(`${fEmail('anna@example.com')}${fName(T.anna)}${pwFields('ok')}`), bottom(btn(T.createAcc)), `<b>2.3 Только пароль</b> (<code>AUTH_METHODS=password</code>). Без сегмента: поля пароля сразу под именем.`, {tall:true})}
    ${phone(step2(`${fEmail('anna@example.com')}${fName(T.anna)}<div class="foot-note">${I('key','sm')}<span>${T.pkHintOnly}</span></div>`), bottom(btn(T.createPk,{icon:'key'})), `<b>2.4 Только passkey</b> (AC-2.6). Без сегмента и полей пароля. Ссылка passkey в журнале в режиме мастера не печатается — её заменяет код.`)}
    ${phone(step2(`${fEmail('anna@example.com','locked')}${fName(T.anna,'locked')}${seg(true)}`), bottom(btn(T.creating,{busy:true})), `<b>2.5 Создаём аккаунт.</b> Поля заблокированы. Для passkey кнопка в этом состоянии, пока открыт системный диалог Face ID / Touch ID. Успех → шаг 3; код истёк или сгорел → 1.7 / 1.8; админ уже есть → 1.9.`)}
  </div>
  <div class="row">
    ${phone(step2(`${fEmail('anna@example.com')}${fName(T.anna)}${seg(true)}${banner('notice','info','',T.pkCancel)}`), bottom(btn(T.createPk,{icon:'key'})), `<b>2.6 Отменили диалог passkey</b> (E-3.2). Не ошибка — нейтральная строка, что аккаунта пока нет. Введённое сохраняется, можно нажать снова или переключиться на «Пароль».`)}
    ${phone(step2(`${fEmail('anna@example.com')}${fName(T.anna)}${seg(true)}${banner('danger','alert',T.pkErrT,T.pkErrB)}`), bottom(btn(T.createPk,{icon:'key'})), `<b>2.7 Ошибка passkey</b> (E-3.2). Аккаунт не создан, полусозданного админа нет. Если пароль выключен — без «или задайте пароль»: «${T.pkErrBOnly}»`)}
    ${phone(step2(`${fEmail('anna@example.com')}${fName(T.anna)}${seg(false)}${banner('warning','link',T.pkUrlT,T.pkUrlB(URL_))}${pwFields('ok')}`), bottom(btn(T.createAcc)), `<b>2.8 Не по PUBLIC_URL, оба способа</b> (AC-2.7). Сегмент сразу на «Пароль», над полями — почему. Если всё же выбрать Passkey — тот же баннер со ссылкой «${T.open(URL_)}» вместо кнопки «Создать passkey». Адрес — <code>192.168.1.20:3000</code> вместо ${URL_}.`, {tall:true})}
  </div>
</section>

<section class="doc-section" id="step3">
  <h2 class="doc-h2">Шаг 3 · Готово</h2>
  <p class="doc-lead">Админ уже вошёл (AC-2.3). Две строки «что дальше» в одном блоке и главная кнопка внизу. Шаг можно пропустить — «Перейти в приложение», дальше обычный первый вход: профиль и норма (OCT-5), подсказка установки PWA (OCT-6). Перезагрузка страницы на шаге 3 ведёт в приложение.</p>
  <div class="row">
    ${phone(step3(false), bottom(btn(T.go)), `<b>3.1 ИИ не настроен.</b> Статус «${T.aiOff}» — кольцом (как в настройках ИИ, OCT-248), не красным: это не ошибка. «${T.aiBtn}» → экран «ИИ-провайдер» (OCT-246); пока его нет — та же кнопка открывает раздел docs про <code>AI_*</code> с иконкой внешней ссылки. «${T.invBtn}» → лист нового приглашения из настроек.`)}
    ${phone(step3(true), bottom(btn(T.go)), `<b>3.2 ИИ настроен</b> (переменные <code>AI_*</code> или настройки админа). Зелёная точка «${T.aiOk}», провайдер и модель моноширинным, без кнопки. Если проверка провайдера упала — «Не отвечает» ромбом и кнопка «${T.aiBtn}», как в OCT-248.`)}
  </div>
</section>

<section class="doc-section" id="desktop">
  <h2 class="doc-h2">Десктоп</h2>
  <p class="doc-lead">Те же шаги в карточке шириной <code>--content-max-width</code> по центру окна, как вход (OCT-13, 6.2). Кнопка — сразу под формой, не прижата к низу. <span class="kbd">Enter</span> отправляет шаг. Поле кода в фокусе при открытии. Команду удобно скопировать — поэтому «Где найти журнал?» здесь чаще раскрывают.</p>
  <div class="row">
    ${desk(`${top()}${step1({open:true, val:'K7QM-3XRP', cls:'focus'})}${btn(T.cont)}`, `<b>Шаг 1</b> с раскрытой подсказкой.`)}
  </div>
  <div class="row">
    ${desk(`${top()}${step2(`${fEmail('anna@example.com')}${fName(T.anna)}${seg(false)}${pwFields('ok')}`)}${btn(T.createAcc)}`, `<b>Шаг 2</b>, пароль. Passkey на компьютере — Touch ID, Windows Hello или телефон по QR, это делает браузер.`)}
    ${desk(`${top()}${step3(false)}${btn(T.go)}`, `<b>Шаг 3.</b>`)}
  </div>
</section>

<section class="doc-section" id="spec">
  <h2 class="doc-h2">Для разработки</h2>
  <div class="spec">
    <ul>
      <li>Новых токенов нет. <code>--font-mono</code> — уже в токенах приложения. Компоненты — из входа и приглашения: поле, сегмент, правила пароля, баннеры, кнопка со спиннером, экран состояния.</li>
      <li>Полоса шагов: три отрезка высотой <code>--space-1</code>, пройденные и текущий — <code>--color-accent</code>. Для VoiceOver — одна подпись «${S.ru.step(1)}» (<code>role="img"</code>), отрезки скрыты.</li>
      <li>Кнопка языка — <code>&lt;button&gt;</code> с глобусом и кодом другого языка, <code>aria-label</code> на том языке, на который переключает. Язык по умолчанию — из браузера, выбор запоминается.</li>
      <li>Поле кода: моноширинный шрифт размера <code>--text-title-size</code>, разрядка 0.14em, по центру; <code>maxlength</code> 9; ошибка — <code>aria-describedby</code> на сообщение, фокус возвращается в поле, текст выделен.</li>
      <li>Заголовок шага получает фокус при переходе (<code>tabindex="-1"</code>), чтобы VoiceOver прочитал новый шаг. Переход между шагами — без анимации сдвига; при <code>prefers-reduced-motion</code> ничего не меняется.</li>
      <li>«Скопировать» — <code>navigator.clipboard</code>, после нажатия иконка на 2 с меняется на галочку, <code>aria-live</code> «Скопировано». Без secure context (http по IP) кнопки нет, команда выделяется по тапу.</li>
      <li>Экраны 1.7–1.10 заменяют форму целиком; кнопка внизу — единственное действие. Экран «Установка не настроена» (OCT-231) показывается вместо мастера при ошибках конфигурации, без изменений.</li>
    </ul>
  </div>
</section>
`;
}
render();

/* language switch in the preview bar (prototype only) */
function langBar(){
  const pv = document.querySelector('.pv-bar');
  if (!pv || pv.querySelector('.lang-bar')) return;
  pv.insertAdjacentHTML('beforeend', `<span style="margin-left:var(--space-4)">Язык</span><div class="pv-seg lang-bar">${['ru','en'].map(l => `<button type="button" data-l="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('')}</div>`);
  pv.querySelectorAll('.lang-bar button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.l; try { localStorage.setItem(KEY, lang); } catch (e) {}
    pv.querySelectorAll('.lang-bar button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', langBar); else langBar();
</script>
