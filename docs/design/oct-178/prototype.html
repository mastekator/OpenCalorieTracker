/* Base components = ../oct-13 + ../oct-16 prototypes (same spec) */
/* ===== Prototype canvas (not part of the app) ===== */

/* ===== App components (tokens only) ===== */
.icon{width:var(--icon-size);height:var(--icon-size);flex:none;fill:none;stroke:currentColor;stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round}

.bottom{padding:var(--space-4) var(--screen-gutter) calc(34px + var(--space-2));display:flex;flex-direction:column;gap:var(--space-3)}
.t-title{font-size:var(--text-title-size);line-height:var(--text-title-lh);font-weight:600}
.t-headline{font-size:var(--text-headline-size);line-height:var(--text-headline-lh);font-weight:600}
.t-body{font-size:var(--text-body-size);line-height:var(--text-body-lh)}
.t-sub{font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh)}
.t-foot{font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.t-cap{font-size:var(--text-caption-size);line-height:var(--text-caption-lh);font-weight:500}

/* brand */

/* buttons */
.btn{appearance:none;border:0;font:inherit;width:100%;min-height:var(--control-height-lg);border-radius:var(--radius-md);font-size:var(--text-headline-size);font-weight:600;display:flex;align-items:center;justify-content:center;gap:var(--space-2);padding:0 var(--space-4);cursor:pointer;transition:transform var(--duration-fast) var(--ease-out),background var(--duration-fast) var(--ease-out)}
.btn:active{transform:scale(var(--press-scale))}
.btn:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}

/* fields */
.field{display:flex;flex-direction:column;gap:var(--space-2)}
.field label{font-size:var(--text-subhead-size);font-weight:500}
.input{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-height-lg);padding:0 var(--space-4);border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border-strong);font-size:var(--text-body-size)}

.field .msg{display:flex;gap:var(--space-1);align-items:flex-start;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary)}
.field .msg.err{color:var(--color-danger)}
.rules{list-style:none;padding:0;display:grid;gap:var(--space-1);font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.rules li{display:flex;gap:var(--space-2);align-items:center;color:var(--color-text-secondary)}
.rules li.ok{color:var(--color-accent)}
.rules li.bad{color:var(--color-danger)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:var(--radius-md);background:var(--color-surface-2);min-height:var(--control-height)}

.seg span.on{background:var(--color-surface);color:var(--color-text);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* grouped lists */
.group-h{font-size:var(--text-footnote-size);color:var(--color-text-secondary);padding:0 var(--space-4) var(--space-2);margin-top:var(--space-6)}
.group{background:var(--color-surface);border-radius:var(--radius-md);overflow:hidden}
.group-f{font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary);padding:var(--space-2) var(--space-4) 0}
.cell{display:flex;align-items:center;gap:var(--space-3);min-height:var(--control-height);padding:var(--space-3) var(--space-4);position:relative;font-size:var(--text-body-size)}

.cell .lead-ic{width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--color-accent-soft);color:var(--color-accent);flex:none}

.cell .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cell .main .sub{font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.cell .val{color:var(--color-text-secondary)}
.cell .chev{color:var(--color-text-secondary)}
.cell.danger{color:var(--color-danger)}
.cell.accent{color:var(--color-accent)}

.badge{font-size:var(--text-caption-size);font-weight:600;padding:2px var(--space-2);border-radius:var(--radius-sm);background:var(--color-surface-2);color:var(--color-text-secondary);white-space:nowrap}
.badge.ok{background:var(--color-accent-soft);color:var(--color-accent)}
.badge.warn{background:var(--color-warning-soft);color:var(--color-warning)}
.badge.err{background:var(--color-danger-soft);color:var(--color-danger)}

/* banners */
.banner{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh)}
.banner .b-title{font-weight:600}
.banner.notice{background:var(--color-notice)}
.banner.warning{background:var(--color-warning-soft)}
.banner.warning .icon{color:var(--color-warning)}
.banner.danger{background:var(--color-danger-soft)}
.banner.danger .icon{color:var(--color-danger)}
.banner.accent{background:var(--color-accent-soft)}
.banner.accent .icon{color:var(--color-accent)}
.banner .close{margin:-10px -12px -10px auto;width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;color:var(--color-text-secondary);flex:none}
.offline-bar{display:flex;gap:var(--space-2);align-items:center;justify-content:center;min-height:32px;padding:var(--space-1) var(--space-4);background:var(--color-notice);font-size:var(--text-footnote-size);color:var(--color-text-secondary)}

/* divider "или" */
.or{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--color-separator)}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--color-scrim);z-index:var(--z-sheet)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-sheet);background:var(--color-surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-sheet);padding:var(--space-2) var(--screen-gutter) calc(34px + var(--space-4));display:flex;flex-direction:column;gap:var(--space-4)}

.sheet .inset{background:var(--color-surface-2)}
.alert{position:absolute;left:50%;top:50%;translate:-50% -50%;width:300px;z-index:var(--z-alert);background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);text-align:center;box-shadow:var(--shadow-toast)}
.alert .btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}
.alert .btns.col{grid-template-columns:1fr}
.toast{position:absolute;left:var(--screen-gutter);right:var(--screen-gutter);bottom:calc(34px + var(--tabbar-height) + var(--space-3));z-index:var(--z-toast);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-toast);font-size:var(--text-subhead-size)}
.toast .act{margin-left:auto;font-weight:600;min-height:var(--tap-min);display:flex;align-items:center}

/* state blocks */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-8) var(--space-6)}
.state .s-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--color-surface-2);color:var(--color-text-secondary);margin-bottom:var(--space-2)}

@keyframes shimmer{to{translate:100% 0}}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-tabbar);height:calc(var(--tabbar-height) + 34px);padding-bottom:34px;background:var(--tabbar-bg);-webkit-backdrop-filter:var(--tabbar-blur);backdrop-filter:var(--tabbar-blur);border-top:1px solid var(--color-separator);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}

.cam .icon{width:30px;height:30px}

/* swatches (docs only) */
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)}
.sw{border-radius:var(--radius-md);overflow:hidden;background:var(--color-surface);font-size:var(--text-caption-size);outline:1px solid var(--color-separator)}
.sw i{display:block;height:44px}
.sw div{padding:var(--space-2);line-height:1.3}
.sheetdoc{width:390px;background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);outline:1px solid var(--color-separator)}

.navmap .col{display:flex;flex-direction:column;gap:var(--space-2)}

.navmap .arrow{color:var(--color-text-secondary);text-align:center}

.frame.wide{width:1280px}

/* ===== OCT-16 additions (tokens only; prototype-only bits marked) ===== */
.frame.sm{width:390px}
.phone .content{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:var(--space-4);padding-bottom:var(--space-4)}

.foot-note{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary)}
.foot-note .icon{color:var(--color-accent)}

/* photo (user content) */
.photo{display:block;width:100%;height:var(--photo-preview-height);border-radius:var(--radius-lg);overflow:hidden;position:relative;background:var(--color-surface-2)}
.photo svg{width:100%;height:100%;display:block}
.photo.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255 / .28) 50%,transparent 70%);translate:-100% 0;animation:sweep 1.8s var(--ease-in-out) infinite}

let T = S[lang];

const phone = (inner, cap, o={}) => `<figure class="frame"><div class="phone ${o.tall ? 'tall' : ''}">${SB()}${o.nav ?? navb(T.settings, T.ai)}${o.top || ''}<div class="content"><div class="pad stack">${inner}</div></div>${o.over || ''}<div class="home-ind"></div></div><figcaption>${cap}</figcaption></figure>`;

const alertBox = (title, body, btns) => `${scrim}<div class="alert" role="alertdialog"><b class="t-headline">${title}</b><p class="t-sub">${body}</p><div class="btns col">${btns}</div></div>`;
const toast = (txt, act) => `<div class="toast" role="status" style="bottom:calc(34px + var(--space-3))"><span>${txt}</span>${act ? `<span class="act">${act}</span>` : ''}</div>`;
const gh = t => `<div class="group-h">${t}</div>`;
const gf = t => `<p class="group-f">${t}</p>`;
const sline = (tone, text, foot) => `<span class="sline ${tone}"><i></i>${text}${foot ? ` <span class="t-foot">· ${foot}</span>` : ''}</span>`;

/* ---------- user screen blocks ---------- */
const device = (on = true, web = true) => `<div>${gh(T.device)}<div class="group"><div class="cell" role="switch" aria-checked="${on}"><span class="main">${T.deviceSw}</span><span class="switch ${on ? 'on' : ''}"></span></div></div>${gf(T.deviceNote + (web ? ' ' + T.deviceNoteWeb : ''))}</div>`;
function sources(sel, o = {}){
  const opts = [
    ['server', T.srcServer, o.serverSub || T.srcServerSub('Google Gemini')],
    ...(o.noKey ? [] : [['key', T.srcKey, T.srcKeySub]]),
    ...(o.noSub ? [] : [['sub', T.srcSub, T.srcSubSub]]),

  return `<div>${gh(T.how)}<div class="group" role="radiogroup" aria-label="${T.how}">${opts.map(([id, n, sub]) => `<div class="cell pick" role="radio" aria-checked="${id === sel}"><span class="radio ${id === sel ? 'on' : ''}"></span><span class="main">${n}<span class="sub">${sub}</span></span></div>${id === sel && o.status ? `<div class="cell" style="padding-left:calc(var(--space-4) + 22px + var(--space-3))"><span class="stat">${o.status}</span>${o.checkBtn === false ? '' : `<button class="btn btn-plain btn-sm">${T.check}</button>`}</div>` : ''}`).join('')}</div>${o.after || ''}</div>`;
}
const stOk = (w = T.min5) => `${sline('ok', T.ok)}<span class="t-foot muted">${T.checked(w)}</span>`;
const consents = (o = {}) => {

};
function keyGroup(o = {}){

  return `<div>${gh(T.keyGroup)}<div class="group">${prov}${key}${model}${o.edit ? '' : where}</div>${o.msg || ''}</div>`;

const delRow = (t = T.delKey) => `<div class="group"><div class="cell danger" role="button">${I('trash','sm')}<span class="main">${t}</span></div></div>`;

}

  const what = o.agent ? [T.cWhatAgent, T.cWhatAgentSub] : [T.cWhatPhoto, T.cWhatPhotoSub];
  const body = `<div class="phead"><span class="picon">${I('spark')}</span><b class="t-title">${T.cTitle(p)}</b></div>
    <p class="t-sub muted">${T.cLead}</p>
    <div class="kv"><div class="r"><span class="k">${T.cWho}</span><span class="v">${p}</span></div><div class="r"><span class="k">${T.cRoute}</span><span class="v">${route[0]}<small class="${o.phone ? '' : 'mono'}">${route[1]}</small></span></div><div class="r"><span class="k">${T.cWhat}</span><span class="v">${what[0]}<small>${what[1]}</small></span></div></div>
    ${p === 'Google Gemini' ? banner('warning', 'warn', T.gemTitle, T.gemBody) : ''}

  const btns = `<div class="stack-sm"><button class="btn btn-primary">${T.allow}</button><button class="btn btn-plain">${T.notNow}</button></div>`;
  if (o.desk) return `${scrim}<div class="dialog" role="dialog" aria-modal="true" aria-label="${T.cTitle(p)}">${body}<div style="display:flex;gap:var(--space-3);justify-content:flex-end"><button class="btn btn-plain btn-sm">${T.notNow}</button><button class="btn btn-primary btn-sm">${T.allow}</button></div></div>`;

const agent = (msg) => phone(`<div class="bubble bot">${T.agentHi}</div><div class="bubble user">${T.agentMsg}</div><div class="banner danger">${I('alert')}<div style="flex:1">${msg}<div style="display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap"><button class="btn btn-tonal btn-sm">${T.formAgent}</button><button class="btn btn-plain btn-sm" style="padding:0 var(--space-2)">${T.toSettings}</button></div></div></div>`, `<b>4.3b Агент нормы, свой ключ не подошёл.</b> Ответа нет, плашка вместо пузыря бота: «Заполнить форму» (главное) и «Настройки ИИ». Лимит подписки: «${T.agentQuota}»`, {nav:navb(lang === 'ru' ? 'Профиль' : 'Profile', T.agentTitle)});

/* ---------- desktop ---------- */
const side = () => `<aside class="side"><div class="brand"><span class="mark">${I('plate','sm')}</span>OpenCalorieTracker</div><button class="btn btn-primary btn-sm" style="width:100%">${I('camera','sm')}${T.addFood}</button>${[['home',0],['book',1],['chart',2],['user',3]].map(([ic, i]) => `<span class="nav-i">${I(ic)}${T.tabs[i]}</span>`).join('')}<div class="foot"><span class="nav-i on">${I('settings')}${T.settings}</span></div></aside>`;
const desk = (inner, cap, over='', url='calories.home.lan/settings/ai') => `<figure class="frame wide"><div class="desk" style="height:auto;min-height:800px"><div class="chrome"><i></i><i></i><i></i><span class="url">${url}</span></div><div class="body">${side()}<div class="main-area"><div class="inner">${inner}</div></div></div>${over}</div><figcaption>${cap}</figcaption></figure>`;

/* ---------- page ---------- */
function render(){
  T = S[lang];
  document.documentElement.lang = lang;
  document.getElementById('doc').innerHTML = `
<h1 class="doc-h1">OCT-178 · ИИ на пользователя</h1>
<p class="doc-lead">Новый раздел «Настройки → ИИ» у каждого пользователя: выключатель на устройстве, источник ИИ (через сервер, свой ключ, своя подписка ChatGPT) и согласия. Перед первой отправкой данных — окно согласия. У админа на экране «ИИ-провайдер» — подписка ChatGPT и выключатель «Разрешить свой API-ключ». Основа — «Продукт OCT-176» (номера AC и E оттуда), формы — из OCT-248. Тексты RU/EN — переключатель «Язык» вверху.</p>

<section class="doc-section" id="user">
  <h2 class="doc-h2">1 · Настройки → ИИ</h2>
  <p class="doc-lead">Вход — строка «ИИ» в группе «Приложение» (заменяет «Распознавание фото» из OCT-25) с подписью текущего источника: «${T.rowAiSub.server}», «${T.rowAiSub.key}» или «${T.rowAiSub.off}». Порядок сверху вниз: устройство → источник → его настройки → согласия. Состояние источника — строкой под выбранным вариантом, тем же StatusLine, что у админа.</p>
  <div class="row">
    ${phone(`${device()}${sources('server', {status:stOk()})}${consents({local:false})}`, `<b>1.1 По умолчанию.</b> ИИ включён, «Через сервер» (AC-A.1), одно согласие. «Отозвать» — 1.9. Пункт «Моя подписка ChatGPT» есть, только если ADR нашёл поток (AC-B2.4); пока его нет — пункта нет совсем, не «скоро».`)}
    ${phone(`${device()}${sources('key')}${keyGroup({edit:true})}${saveBtns()}`, `<b>1.2 Свой ключ, первое подключение.</b> Выбрали «Свой API-ключ» — ниже форма из OCT-248: провайдер (те же 5), ключ, модель (рекомендованная выбрана сама). «Сохранить» = проверка + сохранение (AC-A.2). Пока не сохранено, работает прежний источник.`, {tall:true})}
    ${phone(`${device()}${sources('key', {status:stOk(T.now)})}${keyGroup()}${delRow()}${consents({rows:[['OpenAI', T.viaServer, 'server']]})}`, `<b>1.3 Ключ сохранён (веб).</b> Только «…k7Qz» (AC-A.4). Подпись «где хранится» — всегда видна (AC-A.5). Новое согласие — уже на OpenAI через сервер: провайдер сменился (AC-C.4). «Удалить ключ» — 1.10.`, {tall:true, over:toast(lang === 'ru' ? 'Ключ сохранён. ИИ работает через ваш ключ' : 'Key saved. AI now uses your key')})}
    ${phone(`${device(true, false)}${sources('key', {status:stOk()})}${keyGroup({phone:true})}${delRow()}${consents({rows:[['OpenAI', T.viaPhone, 'phone'], ['Google Gemini', T.viaServer, 'server']]})}`, `<b>1.4 То же в мобильном приложении.</b> Подпись — «Хранится на этом телефоне, запросы напрямую». Согласие «напрямую с этого телефона» — отдельная строка со значком телефона (AC-C.3). Подписи про браузер у выключателя нет.`, {tall:true, nav:navb(T.settings, T.ai)})}
    ${phone(`${device()}${sources('key', {status:sline('err', T.keyBad), checkBtn:true})}${keyGroup({last4:'k7Qz'})}<p class="t-foot muted">${T.keyBadBody}</p>`, `<b>1.5 Ключ перестал работать.</b> Состояния — как у админа (ADR-0013): ромб + «Ключ не подходит», треугольник + «Лимит исчерпан», «Провайдер недоступен», «Модель не принимает фото», кольцо + «${T.notChecked}». Автоматически на сервер не переключаем (AC-A.7).`, {tall:true})}
    ${phone(`${device()}${sources('key')}${keyGroup({edit:true, err:true, msg:''})}${banner('danger', 'alert', T.notSavedKey, T.notSavedKeyBody)}<div class="btn-row"><button class="btn btn-tonal">${T.cancel}</button><button class="btn btn-primary">${T.save}</button></div>`, `<b>1.6 Ключ не прошёл проверку.</b> В отличие от админа, «Сохранить всё равно» нет: невалидный ключ не сохраняется (AC-A.2). Поле ключа подсвечено, текст ошибки — словами ADR-0013.`, {tall:true})}
    ${phone(`${device()}${sources('sub')}${subGroup('not')}${consents()}`, `<b>1.7 Своя подписка ChatGPT, не подключена</b> (B2, вторая волна). «Подключить ChatGPT» → шаги входа (3.3, тот же набросок) → возврат → 1.8.`)}
    ${phone(`${device()}${sources('sub', {status:stOk(T.now)})}${subGroup('ok')}${delRow(T.subOff)}${consents({rows:[['OpenAI', T.viaServer, 'server']]})}`, `<b>1.8 Подписка подключена.</b> Аккаунт, дата входа, «где хранится доступ», ссылка на лимит в ChatGPT — только владельцу подписки (AC-B.2). «Отключить подписку» — подтверждение как 1.10.`, {tall:true})}
    ${phone(`${device()}${sources('server', {status:stOk()})}${consents({local:true})}`, `<b>1.9 Отозвать согласие.</b> Подтверждение с честным текстом про уже отправленное (AC-C.5). После — тост «${T.revoked}», строка исчезает; при следующем фото — снова окно согласия. Локальная модель — строка без кнопки (AC-C.6).`, {over:alertBox(T.revokeQ('Google Gemini'), T.revokeBody, `<button class="btn btn-danger">${T.revokeBtn}</button><button class="btn btn-plain">${T.cancel}</button>`)})}
    ${phone(`${device()}${sources('key', {status:stOk()})}${keyGroup()}${delRow()}`, `<b>1.10 Удалить ключ.</b> После — снова «Через сервер»; если согласия на провайдера сервера нет — спросим при первом фото.`, {over:alertBox(T.delKeyQ, T.delKeyBody, `<button class="btn btn-danger">${T.delBtn}</button><button class="btn btn-plain">${T.cancel}</button>`)})}
  </div>
</section>

<section class="doc-section" id="user-states">
  <h2 class="doc-h2">1b · Выключатель, запрет админа, офлайн</h2>
  <div class="row">
    ${phone(`${device(false)}${banner('notice', 'power', T.deviceOffBanner, T.deviceOffBody)}${sources('server', {status:stOk()})}${consents()}`, `<b>1.11 ИИ выключен на этом устройстве</b> (AC-D.1). Хранится на устройстве. Остальное не приглушаем (контраст AA) и оставляем доступным — это настройки аккаунта для других устройств; плашка объясняет. Включение обратно ничего не спрашивает, кроме согласия, если его нет (AC-D.5).`)}
    ${phone(`${banner('notice', 'info', T.adminOff, T.adminOffBody)}${device()}${sources('server', {noKey:true, noSub:true, status:sline('off', T.notChecked)})}${consents({empty:true})}`, `<b>1.12 Админ запретил свои ключи</b> (AC-A.8, E-1). Плашка показывается один раз, до закрытия; пункта «Свой API-ключ» больше нет. Если у админа нет ИИ: «Через сервер» с подписью «${T.srcServerNone}».`)}
    ${phone(`${device()}${sources('server', {serverSub:T.srcServerSubAdm, status:stOk()})}${consents({rows:[['OpenAI', T.viaServer, 'server']]})}`, `<b>1.13 Сервер на подписке админа</b> (AC-B1.7). Пользователь видит «ChatGPT (подписка администратора)», аккаунт админа — нет. Если Terms не разрешают делить подписку (AC-B1.8) — у не-админа строка «${T.eServerAdmin}» и ручной режим.`)}
    ${phone(`${device()}${sources('key', {status:stOk()})}${keyGroup()}${delRow()}`, `<b>1.14 Офлайн</b> (E-6). Сверху полоса OCT-25. Всё видно; «Проверить», «Заменить», «Удалить», «Отозвать», «Подключить» — при касании тост «${T.needNet}» (как OCT-25 3.6). Выключатель работает.`, {top:`<div class="offline-bar" role="status">${I('wifi-off','sm')}${lang === 'ru' ? 'Офлайн · всё сохраняется на телефоне' : 'Offline · everything is saved on this phone'}</div>`, over:toast(T.needNet)})}
  </div>
</section>

<section class="doc-section" id="consent">
  <h2 class="doc-h2">2 · Окно согласия</h2>
  <p class="doc-lead">Лист снизу (на десктопе — диалог) перед первым обращением к ИИ с данными пользователя для пары «провайдер + маршрут» (AC-C.1). Три строки — кому, как, что уйдёт в этом действии. Свайп вниз и тап мимо = «Не сейчас». Локальной модели окно не показываем (AC-C.6). Проверка админа (1×1) окно не вызывает (AC-C.10).</p>
  <div class="row">
    ${phone(`${photo()}`, `<b>2.1 Первое фото, ИИ через сервер, Gemini.</b> Появляется после снимка, до распознавания. Предупреждение о бесплатном тарифе — только для Gemini. «Разрешить» → сразу распознаём. Касается и тех, кто пользовался ИИ до обновления, включая админа (AC-C.7).`, {nav:reviewNav(), over:consentSheet()})}
    ${phone(`${photo()}`, `<b>2.2 Мобильное приложение, свой ключ OpenAI.</b> «Напрямую с этого телефона» и «сервер установки не участвует». Ссылка на политику — внешняя, в браузере.`, {nav:reviewNav(), over:consentSheet({prov:'OpenAI', phone:true})})}
    ${phone(`<div class="bubble bot">${T.agentHi}</div>`, `<b>2.3 Агент нормы.</b> Тот же лист, «что уйдёт» — ответы в диалоге. Появляется при нажатии «Пройти с агентом», до первого сообщения. Для операций этапа 2 (добавки, отчёт, рецепты) — своя строка «что уйдёт» (итоги дней и т. п.).`, {nav:navb(lang === 'ru' ? 'Профиль' : 'Profile', T.agentTitle), over:consentSheet({agent:true, prov:'OpenAI'})})}
    ${phone(manualPlain(), `<b>2.4 «Не сейчас».</b> Экран ручного ввода с прикреплённым фото (AC-C.2), без тоста и без напоминаний. «Распознать» в плашке — снова окно согласия. Агент нормы → сразу форма нормы. Так же выглядит офлайн-фото без согласия (AC-C.8).`, {nav:reviewNav()})}
  </div>
</section>

<section class="doc-section" id="admin">
  <h2 class="doc-h2">3 · ИИ-провайдер у админа: подписка ChatGPT и свои ключи</h2>
  <p class="doc-lead">Экран OCT-248 без изменений в структуре. «Подписка ChatGPT» — шестой провайдер в шторке. Вместо строк «Ключ API» — аккаунт и дата входа. Новая группа «Пользователи» с выключателем — над «Куда уходят данные», у любого провайдера.</p>
  <div class="row">
    ${phone(`${admCard('off', T.subNot)}${admConn()}`, `<b>3.1 Выбор провайдера.</b> «Подписка ChatGPT» сразу после OpenAI, подсказка «без ключа» (AC-B1.1).`, {nav:admNav(), over:provSheet()})}
    ${phone(`${admCard('off', T.subNot, T.admNotBody)}${admConn()}${shareWarn()}<button class="btn btn-primary">${I('login','sm')}${T.signIn}</button>${usersGrp()}`, `<b>3.2 Не подключена</b> (AC-B1.3). Предупреждение «лимит один на всех» — до входа, жёлтым, со ссылкой на лимит для приложений в ChatGPT (S-B2). Пока не подключена — у всех ручной режим.`, {nav:admNav(), tall:true})}
    ${phone(`${admCard('off', T.subNot)}${admConn()}`, `<b>3.3 Шаги входа — набросок с плейсхолдером.</b> Показан вариант «код на другом устройстве», он не требует SSH. Если ADR OCT-179 выберет другой поток (команда в контейнере, вставка адреса), меняется только содержимое листа: шаги, код или команда в --font-mono. Экран обновляется сам после входа.`, {nav:admNav(), over:stepsSheet()})}
    ${phone(`${admCard('ok', T.ok, '', 'gpt-5.2')}${admConn({signed:true})}<button class="btn btn-tonal">${I('refresh','sm')}${T.checkNow}</button><div class="group"><div class="cell accent" role="button">${I('login','sm')}<span class="main">${T.signInAgain}</span></div><div class="cell danger" role="button">${I('power','sm')}<span class="main">${T.disconnect}</span></div></div>${shareWarn()}${usersGrp()}${admPriv()}`, `<b>3.4 Подключена</b> (AC-B1.4). Аккаунт (если OpenAI его отдаёт), дата входа, модель из списка (OCT-248). «Отключить подписку» — подтверждение «${T.disconnectQ}». Тест модели OCT-248 работает так же.`, {nav:admNav(), tall:true})}
    ${phone(`${admCard('err', T.expired, '', 'gpt-5.2')}${banner('danger', 'alert', T.expired, T.expiredBody)}<button class="btn btn-primary">${I('login','sm')}${T.signInAgain}</button>${admConn({signed:true})}`, `<b>3.5 Вход истёк</b> (AC-B1.6, E-10). Ромб + текст. Главная кнопка — «Войти заново», над формой. У пользователей «через сервер» — «${T.eServer}».`, {nav:admNav()})}
    ${phone(`${admCard('warn', T.limit, '', 'gpt-5.2')}${banner('warning', 'warn', T.limit, T.limitBody, `<div style="margin-top:var(--space-2)">${ext(T.subUsage)}</div>`)}${admConn({signed:true})}`, `<b>3.6 Лимит исчерпан</b> (AC-B.1, 429 usage limit). Без повторов и без переключения. Ссылка на лимит в ChatGPT — владельцу подписки, т. е. админу.`, {nav:admNav()})}
    ${phone(`${usersGrp()}${admPriv()}`, `<b>3.7 Запретить свои ключи</b> (AC-A.8). Подтверждение — только если у кого-то уже есть ключи, иначе переключается сразу. Задано в .env — выключатель с замком и подписью «${T.allowKeysEnv}».`, {nav:admNav(), over:alertBox(T.forbidQ, T.forbidBody(2), `<button class="btn btn-danger">${T.forbidBtn}</button><button class="btn btn-plain">${T.cancel}</button>`)})}
  </div>
</section>

<section class="doc-section" id="errors">
  <h2 class="doc-h2">4 · Ошибки на распознавании и в агенте, «ИИ выключен»</h2>
  <p class="doc-lead">Ошибка своего ключа или подписки говорит про <b>его</b> ключ и ведёт в Настройки → ИИ, а не «к администратору» (AC-A.7, AC-B2.5). Везде — ручной ввод с прикреплённым фото, «Распознать» позже, как при quota_exceeded в OCT-16.</p>
  <div class="row">
    ${phone(errReview('danger', T.eKeyBad, T.eKeyBadBody, `<button class="btn btn-tonal btn-sm">${T.toSettings}</button>`), `<b>4.1 Свой ключ не подошёл.</b> Красная плашка между фото и блюдами, кнопка «Настройки ИИ». Лимит своего ключа — жёлтая: «${T.eKeyQuota}» / «${T.eKeyQuotaBody}» + «Распознать».`, {nav:reviewNav()})}
    ${phone(errReview('warning', T.eSubQuota, T.eSubQuotaBody, `<button class="btn btn-tonal btn-sm">${I('spark','sm')}${T.recognize}</button>${ext(lang === 'ru' ? 'Лимит в ChatGPT' : 'Limit in ChatGPT')}`), `<b>4.2 Лимит своей подписки.</b> Без повторов (AC-B.1). Ссылка на лимит — потому что это его аккаунт. Истёк вход: «${T.eSubExp}» / «${T.eSubExpBody}» + «${T.reconnect}».`, {nav:reviewNav()})}
    ${phone(errReview('danger', T.eServer, T.eServerBody, `<button class="btn btn-tonal btn-sm">${I('spark','sm')}${T.recognize}</button>`), `<b>4.3 ИИ сервера недоступен</b> (подписка админа истекла или лимит). Пользователю не показываем причину админа и ссылок на ChatGPT. Ничего не настраивать — только «Распознать» позже.`, {nav:reviewNav()})}
    ${agent(T.agentBad)}
    ${camera()}
    ${todayOff()}
  </div>
</section>

<section class="doc-section" id="desktop">
  <h2 class="doc-h2">5 · Десктоп (≥ 1024 px)</h2>
  <p class="doc-lead">Настройки → ИИ — две колонки: слева устройство, источник и его форма, справа согласия. Окно согласия — центрированный диалог --dialog-max-width, кнопки справа: «Не сейчас» и «Разрешить». Esc = «Не сейчас», фокус при открытии — на «Разрешить», возвращается на кнопку, которая вызвала действие.</p>
  <div class="row">
    ${desk(`<div class="large-title">${T.ai}</div><div class="cols even"><div class="stack">${device()}${sources('key', {status:stOk()})}${keyGroup()}${delRow()}</div><div class="stack">${consents({rows:[['OpenAI', T.viaServer, 'server'], ['Google Gemini', T.viaServer, 'server']], local:true})}</div></div>`, `<b>5.1 Настройки → ИИ, свой ключ.</b> Колонки независимы по высоте. Тот же порядок, что на телефоне, при чтении сверху вниз и слева направо.`)}
    ${desk(`<div class="large-title">${T.today}</div><div class="drop">${I('upload')}${lang === 'ru' ? 'Перетащите фото еды сюда' : 'Drop a food photo here'}</div>`, `<b>5.2 Согласие при первом фото на десктопе.</b> Перетащили фото → диалог. «Не сейчас» → правка с прикреплённым фото (2.4).`, consentSheet({desk:true}), 'calories.home.lan/')}

<section class="doc-section" id="spec">
  <h2 class="doc-h2">6 · Поведение и спецификация</h2>
  <div class="spec">
    <h3>Экран «ИИ»</h3>
    <ul>
      <li>Маршрут /settings/ai-source (у админа /settings/ai остаётся экраном провайдера сервера). Строка «ИИ» в группе «Приложение» с подписью источника.</li>
      <li>Выбор источника применяется сразу для «Через сервер»; для «Свой API-ключ» и «Моя подписка ChatGPT» — только после успешного «Сохранить» / входа. До этого работает прежний источник, радио показывает выбор, а строка состояния — «${T.notChecked}».</li>
      <li>Загрузка: до 300 мс ничего, дальше скелет групп. Ошибка загрузки — ScreenState с «Повторить».</li>
      <li>Выключатель устройства — localStorage (PWA) / хранилище приложения; не синхронизируется. Состояние читается до первого обращения к ИИ на любом экране.</li>
    </ul>
    <h3>Согласие</h3>
    <ul>
      <li>Лист — role=dialog, aria-modal, заголовок — aria-labelledby; фокус на «Разрешить». Кнопки ≥ 44 pt, «Разрешить» — primary, «Не сейчас» — plain (равнозначный выбор, не «тёмный паттерн»: нет отметки «больше не спрашивать», нет таймера).</li>
      <li>Строки «Кому / Как / Что уйдёт» — dl (dt/dd). Хост сервера — --font-mono.</li>
      <li>Если согласие нужно для операции из очереди (офлайн-фото) — окно не всплывает само: запись сохраняется как ручная с фото, окно — по «Распознать» (AC-C.8).</li>
    </ul>
    <h3>Ошибки</h3>
    <ul>
      <li>Плашка ошибки — role=alert один раз, фокус не переносим. Ошибка = значок + цвет + текст.</li>
      <li>Разделение текстов по источнику: свой ключ → «ваш ключ», своя подписка → «ваша подписка» + ссылка на лимит, через сервер → «ИИ сервера», без причин и ссылок админа.</li>
    </ul>
    <h3>Доступность</h3>
    <ul>
      <li>Источник — radiogroup; строка состояния под выбранным — aria-describedby этого radio. Выключатель — role=switch с подписью строки.</li>
      <li>При выключенном ИИ источник и согласия не приглушаются и не блокируются — это настройки для других устройств; объясняет плашка над ними.</li>
      <li>Код входа ChatGPT VoiceOver читает по символам (aria-label с пробелами).</li>
    </ul>
    <h3>Токены и компоненты</h3>
    <ul>
      <li>Новых токенов нет: --switch-width/-height, --color-accent/-soft, --color-danger/-soft, --color-warning/-soft, --color-notice, --font-mono, --dialog-max-width, --tap-min, --radius-*, --space-*.</li>
      <li>Компоненты: существующие StatusLine, Banner, List/ListRow, Switch, Button, Sheet, ConfirmDialog, Toast, ScreenState, Badge, ProviderForm (OCT-248). Новые: AiSourceScreen, ConsentSheet (sheet / dialog по ширине), ConsentsList, ChatGptSignInSheet, DeviceAiOffNote (строка 4.4 / 4.5).</li>
      <li>Иконки lucide: power, server, smartphone, lock, house, log-in, users, sparkle, triangle-alert, circle-alert, external-link, trash-2, copy.</li>
    </ul>
  </div>
</section>

<section class="doc-section" id="copy">
  <h2 class="doc-h2">7 · Тексты RU / EN</h2>
  <p class="doc-lead">Все новые строки дизайна. Ключи i18n — на усмотрение разработчика, ниже — по месту.</p>
  ${copyTable()}
</section>`;
}
function copyTable(){
  const keys = ['deviceSw','deviceNote','deviceNoteWeb','deviceOffBanner','deviceOffBody','how','srcServer','srcKey','srcSub','srcServerSub','srcServerSubAdm','srcServerNone','srcKeySub','srcSubSub','notChecked','saveNote','whereServer','wherePhone','whereOther','delKey','delKeyQ','delKeyBody','keyBad','keyBadBody','notSavedKey','notSavedKeyBody','subNot','subNotBody','subConnect','subOff','subUsage','consents','revoke','viaServer','viaPhone','local','localSub','consentsNote','consentsEmpty','revokeQ','revokeBody','revoked','adminOff','adminOffBody','offlineBody','needNet',
    'cTitle','cLead','cWho','cRoute','cWhat','cRoutePhone','cRoutePhoneSub','cWhatPhoto','cWhatPhotoSub','cWhatAgent','cWhatAgentSub','cAfter','allow','notNow','manualNote','recognize',
    'subProv','subProvHint','admNot','admNotBody','shareTitle','shareBody','signIn','signInAgain','disconnect','disconnectQ','disconnectBody','expired','expiredBody','limit','limitBody','step1','step2','step3','step4','copyLink','waiting','allowKeys','allowKeysNote','allowKeysEnv','forbidQ','forbidBody','privSub',
    'eKeyBad','eKeyBadBody','eKeyQuota','eKeyQuotaBody','eSubQuota','eSubQuotaBody','eSubExp','eSubExpBody','eServer','eServerBody','eServerAdmin','toSettings','reconnect','agentBad','agentQuota','offCap'];
  const v = (L, k) => { const x = S[L][k]; return typeof x === 'function' ? x(k === 'forbidBody' ? 'N' : '{x}') : x; };
  return `<table class="copy"><thead><tr><th>Строка</th><th>RU</th><th>EN</th></tr></thead><tbody>${keys.map(k => `<tr class="new"><td>${k}</td><td>${v('ru', k)}</td><td>${v('en', k)}</td></tr>`).join('')}</tbody></table>`;
}
render();

/* language switch in the preview bar (prototype only) */
function langBar(){
  const pv = document.querySelector('.pv-bar');
  if (!pv || pv.querySelector('.lang-bar')) return;
  pv.insertAdjacentHTML('beforeend', `<span style="margin-left:var(--space-4)">Язык</span><div class="pv-seg lang-bar">${['ru','en'].map(l => `<button type="button" data-l="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('')}</div>`);
  pv.querySelectorAll('.lang-bar button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.l; try { localStorage.setItem(KEY, lang); } catch (e) {}
    pv.querySelectorAll('.lang-bar button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', langBar); else langBar();
</script>
