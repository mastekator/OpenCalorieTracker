<style>
/* Base components = ../oct-13 + ../oct-16 prototypes (same spec) */
/* ===== Prototype canvas (not part of the app) ===== */
*{box-sizing:border-box;margin:0}

/* ===== Device chrome (prototype only) ===== */
.phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--color-bg);outline:1px solid var(--color-separator);display:flex;flex-direction:column}

.home-ind{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:134px;height:5px;border-radius:var(--radius-full);background:var(--color-text);z-index:100}

/* ===== App components (tokens only) ===== */
.icon{width:var(--icon-size);height:var(--icon-size);flex:none;fill:none;stroke:currentColor;stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:var(--icon-size-sm);height:var(--icon-size-sm)}
.scroll{flex:1;overflow:hidden;display:flex;flex-direction:column}
.navbar{height:var(--navbar-height);flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--space-2)}

.navbar .back{display:flex;align-items:center;gap:2px;color:var(--color-accent);font-size:var(--text-body-size);min-height:var(--tap-min);padding-right:var(--space-2)}
.navbar .act{justify-self:end;color:var(--color-accent);font-size:var(--text-body-size);min-height:var(--tap-min);display:flex;align-items:center;padding:0 var(--space-2)}
.large-title{font-size:var(--text-large-title-size);line-height:var(--text-large-title-lh);font-weight:700;letter-spacing:var(--tracking-tight);padding:var(--space-1) var(--screen-gutter) var(--space-2)}
.pad{padding:0 var(--screen-gutter)}
.stack{display:flex;flex-direction:column;gap:var(--space-4)}
.stack-sm{display:flex;flex-direction:column;gap:var(--space-2)}
.grow{flex:1}
.bottom{padding:var(--space-4) var(--screen-gutter) calc(34px + var(--space-2));display:flex;flex-direction:column;gap:var(--space-3)}
.t-title{font-size:var(--text-title-size);line-height:var(--text-title-lh);font-weight:600}
.t-headline{font-size:var(--text-headline-size);line-height:var(--text-headline-lh);font-weight:600}
.t-body{font-size:var(--text-body-size);line-height:var(--text-body-lh)}
.t-sub{font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh)}
.t-foot{font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.t-cap{font-size:var(--text-caption-size);line-height:var(--text-caption-lh);font-weight:500}

.center{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* brand */
.brand{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-headline-size);font-weight:600}
.brand .mark{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center}

/* buttons */
.btn{appearance:none;border:0;font:inherit;width:100%;min-height:var(--control-height-lg);border-radius:var(--radius-md);font-size:var(--text-headline-size);font-weight:600;display:flex;align-items:center;justify-content:center;gap:var(--space-2);padding:0 var(--space-4);cursor:pointer;transition:transform var(--duration-fast) var(--ease-out),background var(--duration-fast) var(--ease-out)}
.btn:active{transform:scale(var(--press-scale))}
.btn:focus-visible{outline:2px solid var(--color-focus-ring);outline-offset:2px}
.btn-primary{background:var(--color-accent);color:var(--color-on-accent)}

.btn-tonal{background:var(--color-accent-soft);color:var(--color-accent)}
.btn-plain{background:transparent;color:var(--color-accent);min-height:var(--tap-min)}
.btn-danger{background:var(--color-danger);color:var(--color-on-danger)}

/* fields */
.field{display:flex;flex-direction:column;gap:var(--space-2)}
.field label{font-size:var(--text-subhead-size);font-weight:500}
.input{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-height-lg);padding:0 var(--space-4);border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border-strong);font-size:var(--text-body-size)}

.input.focus{border-color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)}

.input.error{border-color:var(--color-danger);box-shadow:inset 0 0 0 1px var(--color-danger)}
.input.locked{background:var(--color-surface-2);border-color:transparent;color:var(--color-text-secondary)}
.field .msg{display:flex;gap:var(--space-1);align-items:flex-start;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary)}
.field .msg.err{color:var(--color-danger)}
.rules{list-style:none;padding:0;display:grid;gap:var(--space-1);font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.rules li{display:flex;gap:var(--space-2);align-items:center;color:var(--color-text-secondary)}
.rules li.ok{color:var(--color-accent)}
.rules li.bad{color:var(--color-danger)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:2px;border-radius:var(--radius-md);background:var(--color-surface-2);min-height:var(--control-height)}
.seg span{display:grid;place-items:center;border-radius:calc(var(--radius-md) - 2px);font-size:var(--text-subhead-size);font-weight:500;color:var(--color-text-secondary)}
.seg span.on{background:var(--color-surface);color:var(--color-text);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* grouped lists */
.group-h{font-size:var(--text-footnote-size);color:var(--color-text-secondary);padding:0 var(--space-4) var(--space-2);margin-top:var(--space-6)}
.group{background:var(--color-surface);border-radius:var(--radius-md);overflow:hidden}
.group-f{font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary);padding:var(--space-2) var(--space-4) 0}
.cell{display:flex;align-items:center;gap:var(--space-3);min-height:var(--control-height);padding:var(--space-3) var(--space-4);position:relative;font-size:var(--text-body-size)}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--space-4);border-top:1px solid var(--color-separator)}
.cell.ic+.cell::before,.cell.ic+.cell.ic::before{left:calc(var(--space-4) + 30px + var(--space-3))}
.cell .lead-ic{width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;background:var(--color-accent-soft);color:var(--color-accent);flex:none}
.cell .lead-ic.danger{background:var(--color-danger-soft);color:var(--color-danger)}
.cell .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cell .main .sub{font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.cell .val{color:var(--color-text-secondary)}
.cell .chev{color:var(--color-text-secondary)}
.cell.danger{color:var(--color-danger)}
.cell.accent{color:var(--color-accent)}
.cell.dis{color:var(--color-text-disabled)}
.badge{font-size:var(--text-caption-size);font-weight:600;padding:2px var(--space-2);border-radius:var(--radius-sm);background:var(--color-surface-2);color:var(--color-text-secondary);white-space:nowrap}
.badge.ok{background:var(--color-accent-soft);color:var(--color-accent)}
.badge.warn{background:var(--color-warning-soft);color:var(--color-warning)}
.badge.err{background:var(--color-danger-soft);color:var(--color-danger)}

/* banners */
.banner{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);font-size:var(--text-subhead-size);line-height:var(--text-subhead-lh)}
.banner .b-title{font-weight:600}
.banner.notice{background:var(--color-notice)}
.banner.warning{background:var(--color-warning-soft)}
.banner.warning .icon{color:var(--color-warning)}
.banner.danger{background:var(--color-danger-soft)}
.banner.danger .icon{color:var(--color-danger)}
.banner.accent{background:var(--color-accent-soft)}
.banner.accent .icon{color:var(--color-accent)}
.banner .close{margin:-10px -12px -10px auto;width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;color:var(--color-text-secondary);flex:none}
.offline-bar{display:flex;gap:var(--space-2);align-items:center;justify-content:center;min-height:32px;padding:var(--space-1) var(--space-4);background:var(--color-notice);font-size:var(--text-footnote-size);color:var(--color-text-secondary)}

/* divider "или" */
.or{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--color-separator)}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--color-scrim);z-index:var(--z-sheet)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-sheet);background:var(--color-surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-sheet);padding:var(--space-2) var(--screen-gutter) calc(34px + var(--space-4));display:flex;flex-direction:column;gap:var(--space-4)}
.sheet .grab{width:36px;height:5px;border-radius:var(--radius-full);background:var(--color-separator);margin:0 auto var(--space-1)}
.sheet .sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet .x{width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;margin-right:calc(-1 * var(--space-3));color:var(--color-text-secondary)}
.sheet .inset{background:var(--color-surface-2)}
.alert{position:absolute;left:50%;top:50%;translate:-50% -50%;width:300px;z-index:var(--z-alert);background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);text-align:center;box-shadow:var(--shadow-toast)}
.alert .btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}
.alert .btns.col{grid-template-columns:1fr}
.toast{position:absolute;left:var(--screen-gutter);right:var(--screen-gutter);bottom:calc(34px + var(--tabbar-height) + var(--space-3));z-index:var(--z-toast);display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-text);color:var(--color-bg);box-shadow:var(--shadow-toast);font-size:var(--text-subhead-size)}
.toast .act{margin-left:auto;font-weight:600;min-height:var(--tap-min);display:flex;align-items:center}

/* state blocks */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-8) var(--space-6)}
.state .s-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--color-surface-2);color:var(--color-text-secondary);margin-bottom:var(--space-2)}
.state .s-ic.danger{background:var(--color-danger-soft);color:var(--color-danger)}
.state .s-ic.warning{background:var(--color-warning-soft);color:var(--color-warning)}
.state p{max-width:30ch}
.state .btn{margin-top:var(--space-3)}
.skel{background:var(--color-surface-2);border-radius:var(--radius-sm);height:14px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;translate:-100% 0;background:linear-gradient(90deg,transparent,var(--color-surface),transparent);animation:shimmer 1.4s var(--ease-in-out) infinite}
@keyframes shimmer{to{translate:100% 0}}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-tabbar);height:calc(var(--tabbar-height) + 34px);padding-bottom:34px;background:var(--tabbar-bg);-webkit-backdrop-filter:var(--tabbar-blur);backdrop-filter:var(--tabbar-blur);border-top:1px solid var(--color-separator);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}

.tab.on{color:var(--color-accent)}
.cam{justify-self:center;width:var(--camera-button-size);height:var(--camera-button-size);border-radius:50%;background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center;box-shadow:var(--shadow-camera);translate:0 -14px}
.cam .icon{width:30px;height:30px}

/* swatches (docs only) */
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)}
.sw{border-radius:var(--radius-md);overflow:hidden;background:var(--color-surface);font-size:var(--text-caption-size);outline:1px solid var(--color-separator)}
.sw i{display:block;height:44px}
.sw div{padding:var(--space-2);line-height:1.3}
.sheetdoc{width:390px;background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4);outline:1px solid var(--color-separator)}
.sheetdoc h3{font-size:var(--text-headline-size)}
.doc-note{font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.navmap{width:820px;background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-6);outline:1px solid var(--color-separator);display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-3);font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.navmap .col{display:flex;flex-direction:column;gap:var(--space-2)}
.navmap .nd{padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--color-surface-2)}
.navmap .nd.tab{background:var(--color-accent-soft);color:var(--color-accent);font-weight:600;align-items:flex-start;font-size:var(--text-footnote-size)}
.navmap .nd.modal{outline:1px dashed var(--color-border-strong);background:transparent}
.navmap .arrow{color:var(--color-text-secondary);text-align:center}

/* ===== Desktop (≥ 1024px) — section 6 ===== */
.frame.wide{width:1280px}
.desk{position:relative;width:1280px;height:800px;border-radius:var(--radius-lg);overflow:hidden;background:var(--color-bg);outline:1px solid var(--color-separator);display:flex;flex-direction:column}
.desk .chrome{height:36px;flex:none;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4);background:var(--color-surface-2);border-bottom:1px solid var(--color-separator);font-size:var(--text-caption-size);color:var(--color-text-secondary)}

.main-area{flex:1;overflow:hidden;padding:var(--space-8) var(--desktop-gutter)}
.main-area .inner{max-width:var(--content-max-width-wide);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6)}

.frame.sm{width:390px}

.foot-note{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh);color:var(--color-text-secondary)}

/* photo (user content) */
.photo{display:block;width:100%;height:var(--photo-preview-height);border-radius:var(--radius-lg);overflow:hidden;position:relative;background:var(--color-surface-2)}
.photo svg{width:100%;height:100%;display:block}
.photo.scan::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255 / .28) 50%,transparent 70%);translate:-100% 0;animation:sweep 1.8s var(--ease-in-out) infinite}
@keyframes sweep{to{translate:100% 0}}
.photo.dim{height:calc(var(--photo-preview-height) * .6)}
.thumb{width:var(--thumb-size);height:var(--thumb-size);border-radius:var(--radius-md);overflow:hidden;flex:none;background:var(--color-surface-2)}
.thumb svg{width:100%;height:100%;display:block}
.thumb.add{display:grid;place-items:center;color:var(--color-accent);background:var(--color-accent-soft);font-size:var(--text-caption-size);font-weight:600;text-align:center;align-content:center;gap:2px}

/* totals header */
.totals{display:flex;gap:var(--space-4);align-items:center}
.kcal-big{display:flex;align-items:baseline;gap:var(--space-1)}
.kcal-big b{font-size:var(--text-large-title-size);line-height:var(--text-large-title-lh);font-weight:700;letter-spacing:var(--tracking-tight);font-variant-numeric:tabular-nums}
.macros{display:flex;gap:var(--space-3);font-size:var(--text-footnote-size);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.macros span{display:flex;align-items:center;gap:var(--space-1)}
.macros i{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-full)}
.m-p{background:var(--color-protein)} .m-f{background:var(--color-fat)} .m-c{background:var(--color-carbs)}

/* dish row */
.dish{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4);position:relative;background:var(--color-surface)}
.dish+.dish::before{content:"";position:absolute;top:0;right:0;left:var(--space-4);border-top:1px solid var(--color-separator)}
.dish-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3)}
.dish-top .name{font-size:var(--text-headline-size);font-weight:600;line-height:var(--text-headline-lh)}
.dish-top .kc{font-size:var(--text-headline-size);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dish-meta{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-footnote-size);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:2px}
.badge .icon{width:14px;height:14px}
.dish-ctl{display:flex;align-items:center;gap:var(--space-2)}
.step{width:var(--tap-min);height:var(--tap-min);border-radius:var(--radius-full);background:var(--color-surface-2);color:var(--color-accent);display:grid;place-items:center;flex:none}
.step.dis{color:var(--color-text-disabled)}
.wv{width:var(--stepper-value-width);height:var(--control-height);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;gap:var(--space-1);font-size:var(--text-body-size);font-variant-numeric:tabular-nums;background:var(--color-surface)}
.wv small{font-size:var(--text-subhead-size);color:var(--color-text-secondary)}
.wv.focus{border-color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)}
.wv.error{border-color:var(--color-danger);box-shadow:inset 0 0 0 1px var(--color-danger)}
.dish .more{margin-left:auto;width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;color:var(--color-text-secondary)}
.dish .err-msg{display:flex;gap:var(--space-1);align-items:center;font-size:var(--text-footnote-size);color:var(--color-danger)}
.hint{display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--color-accent-soft);font-size:var(--text-footnote-size);line-height:var(--text-footnote-lh)}
.hint .acts{display:flex;gap:var(--space-4)}
.hint .acts span{color:var(--color-accent);font-weight:600;min-height:var(--tap-min);display:flex;align-items:center}
.hint .acts span+span{color:var(--color-text-secondary);font-weight:500}
/* swipe-to-delete reveal */
.swipe{position:relative;background:var(--color-danger);overflow:hidden}
.swipe .dish{translate:-96px 0}
.swipe .del{position:absolute;right:0;top:0;bottom:0;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--color-on-danger);font-size:var(--text-footnote-size);font-weight:600}
.add-row{display:flex;align-items:center;gap:var(--space-2);color:var(--color-accent);font-size:var(--text-body-size);font-weight:500;min-height:var(--tap-min);padding:0 var(--space-4)}

/* recognition */
.recog-title{display:flex;align-items:center;gap:var(--space-3)}
.skel-dish{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4);background:var(--color-surface);border-radius:var(--radius-md)}
.state.compact{padding:var(--space-4) var(--space-6) 0}

/* today (minimal stand-in; full screen is OCT-19) */
.today-card{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-2)}
.display{font-size:var(--text-display-size);line-height:var(--text-display-lh);font-weight:700;letter-spacing:var(--tracking-tight);font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.quick .btn{width:100%}
.meal{display:flex;align-items:center;gap:var(--space-3)}
.meal .thumb{width:44px;height:44px;border-radius:var(--radius-sm)}
.meal.new{background:var(--color-accent-soft)}
.action-sheet{position:absolute;left:var(--space-2);right:var(--space-2);bottom:calc(34px + var(--space-2));z-index:var(--z-sheet);display:flex;flex-direction:column;gap:var(--space-2)}
.action-sheet .grp{background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden}
.action-sheet .it{display:flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--control-height-lg);font-size:var(--text-body-size);color:var(--color-accent);position:relative}
.action-sheet .it+.it::before{content:"";position:absolute;top:0;left:0;right:0;border-top:1px solid var(--color-separator)}
.action-sheet .cancel{font-weight:600}

/* manual form */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.field .input.num .val{font-variant-numeric:tabular-nums}
.field .input .unit{color:var(--color-text-secondary);font-size:var(--text-subhead-size)}
.field .msg.warn{color:var(--color-warning)}
.result{display:flex;justify-content:space-between;align-items:baseline;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-surface-2);font-size:var(--text-subhead-size);font-variant-numeric:tabular-nums}
.result b{font-size:var(--text-headline-size)}
.req{color:var(--color-text-secondary);font-weight:400}

/* ===== Prototype-only: system camera of iOS & tap markers ===== */
.sys{background:#000;color:#fff}
.sys .viewfinder{flex:1;margin-top:var(--space-12);overflow:hidden}
.sys .viewfinder svg{width:100%;height:100%;display:block}
.sys .shutter-row{height:180px;display:flex;align-items:center;justify-content:space-around;padding-bottom:34px;font-size:var(--text-body-size)}
.sys .shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.sys .shutter::after{content:"";width:58px;height:58px;border-radius:50%;background:#fff}
.tap{position:absolute;z-index:200;width:64px;height:64px;border-radius:50%;border:3px solid var(--color-accent);box-shadow:0 0 0 6px var(--color-accent-soft);pointer-events:none}
.tap b{position:absolute;top:-14px;right:-14px;width:28px;height:28px;border-radius:50%;background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center;font-size:var(--text-subhead-size)}
.flow-arrow{align-self:center;color:var(--color-text-secondary)}
.auto{position:absolute;z-index:200;top:64px;right:16px;padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);background:var(--color-accent);color:var(--color-on-accent);font-size:var(--text-footnote-size);font-weight:600}

/* ===== Desktop modal flow ===== */
.flow-win{position:absolute;left:50%;top:50%;translate:-50% -50%;width:var(--modal-flow-max-width);max-height:90%;z-index:var(--z-sheet);background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-toast);display:flex;flex-direction:column;overflow:hidden}
.flow-win .wh{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-3) var(--space-3) var(--space-6);border-bottom:1px solid var(--color-separator)}
.flow-win .wb{display:grid;grid-template-columns:240px 1fr;gap:var(--space-6);padding:var(--space-6);overflow:hidden}
.flow-win .wf{display:flex;justify-content:flex-end;gap:var(--space-3);padding:var(--space-4) var(--space-6);border-top:1px solid var(--color-separator)}
.flow-win .wf .btn{width:auto;min-width:160px}
.flow-win .photo{height:240px}
.dish .trash{width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;color:var(--color-danger);border-radius:var(--radius-md);background:var(--color-hover)}
.dropzone{position:absolute;inset:var(--space-4);z-index:var(--z-sheet);border:2px dashed var(--color-accent);border-radius:var(--radius-lg);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);color:var(--color-accent);font-size:var(--text-title-size);font-weight:600}
.dropzone .icon{width:48px;height:48px}


/* ===== OCT-19 additions: Today, Diary, Week (tokens only) ===== */
.phone .content{padding-bottom:calc(var(--tabbar-height) + 34px + var(--space-4))}
.phone .content.modal{padding-bottom:var(--space-4)}
.phone .bottom.bar{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.large-title .date{display:block;font-size:var(--text-subhead-size);font-weight:400;letter-spacing:0;color:var(--color-text-secondary);margin-top:2px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-2)}
.title-row .txt-btn{color:var(--color-accent);font-size:var(--text-body-size);min-height:var(--tap-min);display:flex;align-items:center;padding:0 var(--screen-gutter);font-weight:500}

/* card + numbers */
.card{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.card .lbl{display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-subhead-size);color:var(--color-text-secondary)}
.card .lbl.over{color:var(--color-warning);font-weight:600}
.big{display:flex;align-items:baseline;gap:var(--space-2)}
.big .unit{font-size:var(--text-subhead-size);color:var(--color-text-secondary)}
.big .display.sm{font-size:var(--text-large-title-size);line-height:var(--text-large-title-lh)}
.week-line{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);min-height:var(--tap-min);margin:0 calc(-1 * var(--space-5)) calc(-1 * var(--space-5));padding:0 var(--space-3) 0 var(--space-5);border-top:1px solid var(--color-separator);font-size:var(--text-subhead-size);font-variant-numeric:tabular-nums}
.week-line b{font-weight:600}
.week-line .icon{color:var(--color-text-secondary)}
.week-line.over b{color:var(--color-warning)}
.invite{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-accent-soft);font-size:var(--text-subhead-size)}
.invite .icon{color:var(--color-accent)}
.invite .go{margin-left:auto;color:var(--color-accent);font-weight:600;min-height:var(--tap-min);display:flex;align-items:center;white-space:nowrap}

/* progress bars: fill = eaten up to the norm; hatched tail = over the norm (pattern, not only colour) */
.pbar{height:var(--progress-height);border-radius:var(--radius-full);background:var(--color-surface-2);display:flex;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--color-accent)}
.pbar i.p{background:var(--color-protein)} .pbar i.f{background:var(--color-fat)} .pbar i.c{background:var(--color-carbs)}
.pbar i.ov,.hatch{background-image:repeating-linear-gradient(-45deg,var(--color-warning) 0 calc(var(--hatch-size) / 2),transparent 0 var(--hatch-size))}
.pbar.none{background:transparent;outline:1px dashed var(--color-separator)}

/* macros block */
.mac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.mac{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.mac-h{display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.mac-h i{width:var(--space-2);height:var(--space-2);border-radius:var(--radius-full)}
.mac-v{font-size:var(--text-headline-size);font-weight:600;font-variant-numeric:tabular-nums}
.mac-v small{font-size:var(--text-footnote-size);font-weight:400;color:var(--color-text-secondary)}
.mac .pbar{margin:var(--space-1) 0}
.mac .rest{white-space:nowrap;font-size:var(--text-footnote-size);color:var(--color-text-secondary);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:2px}
.mac .rest.over{color:var(--color-warning);font-weight:600}
.mac .rest .icon{width:14px;height:14px}
.mac-rows{display:flex;flex-direction:column;gap:var(--space-3)}
.mac-row{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-3);align-items:center}
.mac-row .mac-h{font-size:var(--text-subhead-size);color:var(--color-text)}
.mac-row .mac-v{justify-self:end;font-size:var(--text-subhead-size)}
.mac-row .pbar{grid-column:1 / -1}

/* meal rows (Today / Diary) */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--text-footnote-size);color:var(--color-text-secondary);padding:0 var(--space-4) var(--space-2)}
.cell.meal .thumb{width:var(--meal-thumb-size);height:var(--meal-thumb-size);border-radius:var(--radius-sm)}
.cell.meal .thumb.icon-only{display:grid;place-items:center;color:var(--color-text-secondary)}
.cell.meal .main .t{display:flex;gap:var(--space-2);align-items:center;font-weight:600;font-size:var(--text-body-size)}
.cell.meal .main .t small{font-weight:400;color:var(--color-text-secondary);font-size:var(--text-subhead-size);font-variant-numeric:tabular-nums}
.cell.meal .main .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.meal .main .st{display:flex;gap:var(--space-1);margin-top:2px}
.cell.meal .val{color:var(--color-text);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.meal .val.zero{color:var(--color-text-secondary);font-weight:400}
.cell.meal.queued .thumb{opacity:.7}
.swipe .cell.meal{translate:-96px 0;background:var(--color-surface)}
.cell.meal .trash{width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;color:var(--color-danger);border-radius:var(--radius-md);background:var(--color-hover);flex:none}
.cell.meal.hover{background:var(--color-hover)}

/* day / period switcher */
.pager{display:grid;grid-template-columns:var(--tap-min) 1fr var(--tap-min);align-items:center;gap:var(--space-2)}
.pager .ib{width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;border-radius:var(--radius-full);color:var(--color-accent);background:var(--color-surface)}
.pager .ib.dis{color:var(--color-text-disabled);background:transparent}
.pager .pick{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:var(--tap-min);text-align:center}
.pager .pick .t-headline{display:flex;align-items:center;gap:var(--space-1)}
.pager .pick .icon{width:16px;height:16px;color:var(--color-text-secondary)}
.sum-line{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);font-variant-numeric:tabular-nums}
.sum-line .rest{font-size:var(--text-subhead-size);color:var(--color-text-secondary)}
.sum-line .rest.over{color:var(--color-warning);font-weight:600}

/* chart */
.chart{display:flex;flex-direction:column;gap:var(--space-2)}
.plot{position:relative;height:var(--chart-height);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--space-2);align-items:end;border-bottom:1px solid var(--color-separator)}
.plot.month{gap:2px}
.plot.wide{height:var(--chart-height-wide);gap:var(--space-4)}
.plot .norm{position:absolute;left:0;right:0;border-top:2px dashed var(--color-text-secondary);z-index:1;pointer-events:none}
.plot .norm span{position:absolute;right:0;bottom:2px;font-size:var(--text-caption-size);color:var(--color-text-secondary);background:var(--color-surface);padding:0 var(--space-1);font-variant-numeric:tabular-nums}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;min-height:var(--tap-min);border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.col .b{display:flex;flex-direction:column-reverse;border-radius:var(--radius-sm) var(--radius-sm) 0 0;overflow:hidden;min-height:2px}
.col .b .in{background:var(--color-accent);flex:none}
.col .b .ov{flex:none;background-color:var(--color-warning-soft)}
.col .b .ov.hatch{background-color:var(--color-warning-soft)}
.col.today .b .in{background:var(--color-accent)}
.col.past .b .in{opacity:1}
.col .v{font-size:var(--text-caption-size);font-weight:500;color:var(--color-text-secondary);text-align:center;font-variant-numeric:tabular-nums;margin-bottom:var(--space-1);white-space:nowrap}
.col .v.over{color:var(--color-warning);font-weight:600}
.col.zero .b{background:var(--color-separator);height:2px}
.col.sel{outline:2px solid var(--color-focus-ring);outline-offset:2px}
.col .clip{position:absolute;left:-2px;right:-2px;height:8px;background:var(--color-surface);clip-path:polygon(0 50%,15% 0,30% 50%,45% 0,60% 50%,75% 0,90% 50%,100% 0,100% 50%,85% 100%,70% 50%,55% 100%,40% 50%,25% 100%,10% 50%,0 100%)}
.xl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--space-2);font-size:var(--text-caption-size);color:var(--color-text-secondary);text-align:center;font-variant-numeric:tabular-nums;line-height:var(--text-caption-lh)}
.xl.month{gap:2px}
.xl.wide{gap:var(--space-4)}
.xl span em{display:block;font-style:normal;margin-top:2px;color:var(--color-text-secondary)}
.xl span em.over{color:var(--color-warning);font-weight:600}
.xl span b{display:block;font-weight:600;color:var(--color-text)}
.xl span.today{color:var(--color-accent)}
.xl span.today b{color:var(--color-accent)}
.xl span.future{color:var(--color-text-disabled)}
.xl span.future b{color:var(--color-text-disabled)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);font-size:var(--text-caption-size);color:var(--color-text-secondary)}
.legend span{display:flex;align-items:center;gap:var(--space-1)}
.legend i{width:14px;height:10px;border-radius:2px;background-color:var(--color-accent)}
.legend i.ov{background-color:var(--color-warning-soft)}
.legend i.ln{height:0;border-top:2px dashed var(--color-text-secondary);border-radius:0}
.chart-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1);text-align:center;color:var(--color-text-secondary);font-size:var(--text-subhead-size)}
.tip{position:absolute;z-index:2;translate:-50% 0;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--color-text);color:var(--color-bg);font-size:var(--text-footnote-size);white-space:nowrap;box-shadow:var(--shadow-toast);font-variant-numeric:tabular-nums}
.avg-note{font-size:var(--text-footnote-size);color:var(--color-text-secondary)}
.callout{display:flex;flex-direction:column;gap:2px;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-accent-soft);font-size:var(--text-subhead-size);font-variant-numeric:tabular-nums}
.callout b{font-size:var(--text-headline-size);color:var(--color-accent)}
.callout.over{background:var(--color-warning-soft)}
.callout.over b{color:var(--color-warning)}

/* edit-record additions (screen 4 opened from Diary) */
.when{display:flex;align-items:center;gap:var(--space-3);min-height:var(--control-height);padding:0 var(--space-4);border-radius:var(--radius-md);background:var(--color-surface);font-size:var(--text-body-size)}
.when .v{margin-left:auto;color:var(--color-accent);font-variant-numeric:tabular-nums}
.when .icon{color:var(--color-text-secondary)}
.late{display:flex;flex-direction:column;gap:var(--space-2)}
.picker{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-sheet);background:var(--color-surface-2);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:var(--space-3) var(--space-4) calc(34px + var(--space-3));display:flex;flex-direction:column;gap:var(--space-2);box-shadow:var(--shadow-sheet)}
.picker .ph{display:flex;justify-content:space-between;font-size:var(--text-body-size);color:var(--color-accent);min-height:var(--tap-min);align-items:center}
.picker .wheel{display:grid;grid-template-columns:2fr 1fr 1fr;text-align:center;font-size:var(--text-body-size);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.picker .wheel div{display:flex;flex-direction:column;gap:var(--space-2)}
.picker .wheel .on{color:var(--color-text);font-weight:600;background:var(--color-surface);border-radius:var(--radius-sm);padding:var(--space-1) 0}

/* desktop */
.desk .cols.even{grid-template-columns:1fr 1fr}

const DAY_Y = {breakfast:['oats'], lunch:['rice'], dinner:['pumpkin','pork'], snack:['mochi']};

const dayTotal = day => sum(Object.values(day).flat());

const bar = (v, n, cls='') => `<div class="pbar" aria-hidden="true"><i class="${cls}" style="width:${Math.min(100, v / n * 100)}%"></i></div>`;
function kcalCard(e){
  const one = (nm, cls, v, nv) => `<div class="mac"><span class="mac-h"><i class="m-${cls}"></i>${nm}</span><span class="mac-v">${fmt(v)}<small> / ${nv}${NB}${T.g}</small></span>${bar(v, nv, cls)}<span class="rest">${T.gLeft(fmt(nv - v))}</span></div>`;

function row(id, o={}){
  const d = D[id], t = clock(d.h, d.m);

<section class="doc-section" id="spec">
  <h2 class="doc-h2">7 · Для разработки</h2>
  <ul class="spec">
    <li>Порядок секций фиксированный: breakfast, lunch, dinner, snack. Внутри — по <code>eatenAt</code> от раннего к позднему (не по часам на циферблате: поздний перекус в 00:30, засчитанный во вчера, идёт после 16:00).</li>
    <li>Секция = карточка (<code>--color-surface</code>, <code>--radius-lg</code>), между секциями <code>--space-3</code>. Шапка: название и итог ккал — <code>--text-headline-*</code>; БЖУ — <code>--text-footnote-*</code>, <code>--color-text-secondary</code>, формат «Б 42 · Ж 29 · У 73 г» с неразрывными пробелами. Итоги — из тех же сумм, что карточка дня (сумма по записям, округление при выводе).</li>
    <li>Строка записи (один <code>MealRow</code> на обоих экранах): миниатюра <code>--meal-thumb-size</code>; первая строка — названия блюд через запятую, обрезка многоточием; вторая — время и плашки («Ждёт отправки», «Ошибка», луна позднего приёма); справа ккал обычным начертанием (жирный — только у итога секции).</li>
    <li>Пустой приём: строка высотой <code>--control-height-lg</code>, название <code>--color-text-secondary</code>, справа «+ Добавить» акцентом. Действие — <code>CaptureMenu</code> с заголовком «Добавить завтрак» и выбранным типом; в дневнике — ещё и с датой дня.</li>
    <li>Свайп: две кнопки по <code>--swipe-action-width</code>; «Перенести» — <code>--color-accent</code> / <code>--color-on-accent</code>, «Удалить» — как сейчас. Полный свайп — удаление. Лист переноса — <code>Sheet</code> + <code>List</code>, текущий тип с галочкой и <code>aria-disabled</code>. После переноса — подсветка <code>meal-row--new</code> и тост с «Вернуть»; запись уходит через outbox, как правка.</li>
    <li>Компьютер: кнопки на строке по образцу корзины (<code>--tap-min</code>, <code>--color-hover</code>), «Перенести» открывает тот же список поповером. Перетаскивание — HTML5 DnD или pointer events только при <code>(pointer: fine)</code>; цель — пунктир 2${NB}px <code>--color-accent</code> + <code>--color-accent-soft</code>. Esc отменяет.</li>
    <li>VoiceOver: скрытый <code>h2</code> «Приёмы пищи»; каждая секция — <code>&lt;section aria-labelledby&gt;</code> с <code>h3</code> «Ужин, 508 ккал»; у строки БЖУ — полная подпись «белки 29 г, жиры 37 г, углеводы 16 г». Строка: «Моти, 17:10, 190 ккал»; кнопки: «Перенести «Моти» в другой приём», «Удалить «Моти»»; пустой приём: «Добавить завтрак». Перетаскивание — только для мыши, у клавиатуры и VoiceOver есть кнопка «Перенести».</li>
    <li>Настройка <code>groupByMeal</code> (boolean, по умолчанию <code>true</code>) — в настройках пользователя на сервере, рядом с маскотом; переключатель — существующий <code>Switch</code> в группе «Вид». При <code>false</code> — прежний плоский список (один <code>MealRow</code> на всё, вторая строка «Тип · время»), прежние заглушки пустого дня, без перетаскивания.</li>
    <li>Время приёмов <code>mealBoundaries</code> — пять чисел в минутах от полуночи, по умолчанию <code>[300, 660, 900, 1080, 1320]</code> (05 · 11 · 15 · 18 · 22), в настройках пользователя рядом с <code>groupByMeal</code>; <code>mealTypeAt</code> читает их вместо констант. Шаг 30${NB}мин, приём не короче 60${NB}мин, первая граница ≥ 03:00, последняя ≤ 24:00. Меняет только тип по умолчанию у новых записей (и время по умолчанию в «+ Добавить» — середина окна); старые записи не трогаем. Сохранение на каждое касание, офлайн — через outbox. На компьютере — тот же экран в области настроек.</li>
    <li>Удалено (при включённой группировке): заглушки «Пока ничего не съедено» (Сегодня) и «Записей нет» (дневник), подпись «N приёмов пищи». Тип в строке записи не дублируется.</li>
  </ul>
</section>

function scale(){
  const W = 952, X = h => `${h / 24 * 100}%`;
  const seg = (a, b, cls, t) => `<span class="${cls}" style="width:${(b - a) / 24 * 100}%">${b - a >= 2 ? t : ''}</span>`;
  const ty = T.type;
  const cur = [[0,5,'s',ty.snack],[5,11,'b',ty.breakfast],[11,16,'l',ty.lunch],[16,22,'d',ty.dinner],[22,24,'s',ty.snack]];
  const nxt = [[0,5,'s',ty.snack],[5,11,'b',ty.breakfast],[11,15,'l',ty.lunch],[15,18,'s',ty.snack],[18,22,'d',ty.dinner],[22,24,'s',ty.snack]];
  const pts = [[12.67,0,`${name('salad')} ${clock(12,40)}`],[13.08,1,`${name('rice')} ${clock(13,5)}`],[17.17,0,`${name('mochi')} ${clock(17,10)}`],[17.85,1,`${name('mango')} ${clock(17,51)}`],[20.62,0,`${name('pumpkin')} ${clock(20,37)}`],[20.63,2,`${name('pork')} ${clock(20,38)}`]];
  const ax = Array.from({length:9}, (_, i) => `<i style="left:${X(i * 3)}">${String(i * 3).padStart(2, '0')}:00</i>`).join('');
  return `<span class="lbl">Реальный день владельца</span><div class="pts" style="height:80px">${pts.map(([h, r, l]) => `<b style="left:${X(h)};top:${r * 26}px">${l}</b>`).join('')}</div>
  <span class="lbl">Сейчас: 05 · 11 · 16 · 22</span><div class="bar">${cur.map(s => seg(...s)).join('')}</div>
  <span class="lbl">Предлагаю: 05 · 11 · 15 · 18 · 22 — перекус 15:00–17:59 между обедом и ужином</span><div class="bar">${nxt.map(s => seg(...s)).join('')}</div><div class="ax">${ax}</div>`;
}

/* language switch in the preview bar (prototype only) */
function langBar(){
  const pv = document.querySelector('.pv-bar');
  if (!pv || pv.querySelector('.lang-bar')) return;
  pv.insertAdjacentHTML('beforeend', `<span style="margin-left:var(--space-4)">Язык</span><div class="pv-seg lang-bar">${['ru','en'].map(l => `<button type="button" data-l="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('')}</div>`);
  pv.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.l; try { localStorage.setItem(KEY, lang); } catch (e) {}
    pv.querySelectorAll('[data-l]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
}
render();
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', langBar); else langBar();
