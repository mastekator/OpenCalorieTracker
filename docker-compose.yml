# Settings live in .env next to this file: copy .env.example, then set at least
# PUBLIC_URL, ADMIN_EMAIL and ADMIN_PASSWORD. AI_* are optional (no AI = manual entry).
# All variables: docs/SELF_HOSTING.md
services:
  opencalorietracker:
    # Pinned release; to update, change the tag and run `docker compose pull && docker compose up -d`.
    image: ghcr.io/mastekator/opencalorietracker:0.1.1
    restart: unless-stopped
    ports:
      # Loopback only: the reverse proxy must be the sole way in, or X-Forwarded-For can be forged.
      # Proxy on another host: publish on a private interface (e.g. '10.0.0.5:3000:3000') that only it reaches.
      - '127.0.0.1:3000:3000'
    volumes:
      # Database and photos in ./data next to this file; back this folder up.
      # The app runs as PUID:PGID from .env (default 1000:1000) and takes ownership of ./data.
      - ./data:/data
    env_file: .env
